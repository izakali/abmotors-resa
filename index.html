<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AB Motors</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #0ea5e9;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --border-color: #334155;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            background-image: url('https://raw.githubusercontent.com/ton-repo/bateau.PNG');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .overlay {
            background: rgba(15, 23, 42, 0.85);
            min-height: 100vh;
            width: 100%;
        }
        /* Navbar Responsive */
        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid var(--border-color);
        }
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
        }
        nav a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        nav a:hover, nav a.active {
            background: rgba(255, 255, 255, 0.1);
        }
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .icon-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .btn-danger { background: var(--accent-red); color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
        .btn-success { background: var(--accent-green); color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
        .btn-primary { background: var(--accent-blue); color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; width: 100%; }
        
        /* Conteneurs */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .panel {
            background: var(--bg-panel);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 2rem;
        }
        
        /* Formulaires & Tables */
        input, select {
            width: 100%;
            padding: 0.75rem;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 6px;
            margin-bottom: 1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        
        /* Dates visuelles */
        .date-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-bottom: 1rem;
        }
        .date-cell {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .date-cell.selected {
            background: var(--accent-green);
            color: white;
            font-weight: bold;
        }
        
        /* Login Split Buttons */
        .login-helpers {
            display: flex;
            justify-content: space-between;
            margin-top: 1rem;
            font-size: 0.85rem;
        }
        .login-helpers a {
            color: var(--accent-blue);
            text-decoration: none;
            cursor: pointer;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: rgba(0,0,0,0.3);
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
        }
        .stat-card h3 { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem; }
        .stat-card .value { font-size: 1.5rem; font-weight: bold; color: var(--accent-blue); }

        /* Suppression de toutes popups */
        .popup, .modal { display: none !important; }
        
        @media (max-width: 768px) {
            nav { flex-direction: column; gap: 1rem; }
            .nav-links { justify-content: center; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="overlay" id="app"></div>

    <script>
        // --- ETAT GLOBAL ---
        const state = {
            user: JSON.parse(localStorage.getItem('abmotors_user')) || null,
            route: window.location.pathname === '/' ? '/login' : window.location.pathname,
            data: { reservations: [], users: [] }
        };

        // --- UTILITAIRES ---
        const convertToKMF = (euros) => (euros * 500) + ' KMF';
        
        const cleanText = (str) => {
            if (!str) return '';
            return str.replace(/\(|\)/g, '').replace(/aprem/gi, 'apres midi');
        };

        // --- NAVIGATION SANS HASH ---
        function navigate(path) {
            window.history.pushState({}, '', path);
            state.route = path;
            render();
        }

        window.addEventListener('popstate', () => {
            state.route = window.location.pathname;
            render();
        });

        // --- SYNCHRONISATION DONNEES ---
        function loadData() {
            if (!state.user || state.user.role !== 'Admin') return;
            google.script.run.withSuccessHandler(res => {
                state.data = res;
                render();
            }).getDashboardData();
        }

        // --- ACTIONS ---
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            google.script.run.withSuccessHandler(res => {
                if(res.success) {
                    state.user = res.user;
                    localStorage.setItem('abmotors_user', JSON.stringify(res.user));
                    navigate(res.user.role === 'Admin' ? '/admin/stats' : '/client/book');
                } else {
                    document.getElementById('login-error').innerText = cleanText(res.message);
                }
            }).loginUser(email, password);
        }

        function logout() {
            state.user = null;
            localStorage.removeItem('abmotors_user');
            navigate('/login');
        }

        function toggleDateSelection(element) {
            element.classList.toggle('selected');
        }

        function archiveUser(userId) {
            google.script.run.withSuccessHandler(res => {
                if(res.success) loadData();
            }).archiveAccount(userId);
        }

        // --- MOTEUR DE RENDU ---
        function render() {
            const app = document.getElementById('app');
            let html = '';

            // Si non connecté, forcer page login
            if (!state.user) {
                html = renderLoginView();
            } else if (state.user.role === 'Admin') {
                html = renderAdminNav() + renderAdminContent();
            } else {
                html = renderClientNav() + renderClientContent();
            }

            app.innerHTML = cleanText(html);
            
            // Attacher événements spécifiques après rendu
            if(document.getElementById('login-form')) {
                document.getElementById('login-form').addEventListener('submit', handleLogin);
            }
        }

        // --- VUES ---
        function renderLoginView() {
            return `
            <div class="container" style="max-width: 400px; margin-top: 10vh;">
                <div class="panel">
                    <h2 style="text-align: center; margin-bottom: 2rem;">Espace Sécurisé</h2>
                    <div id="login-error" style="color: var(--accent-red); margin-bottom: 1rem; text-align: center;"></div>
                    <form id="login-form">
                        <label>Adresse e-mail</label>
                        <input type="email" id="email" required>
                        <label>Mot de passe</label>
                        <input type="password" id="password" required>
                        <button type="submit" class="btn-primary">Se connecter</button>
                    </form>
                    <div class="login-helpers">
                        <a onclick="navigate('/forgot-password')">Mot de passe oublié ?</a>
                        <a onclick="navigate('/banned-appeal')">Compte désactivé ?</a>
                    </div>
                </div>
            </div>`;
        }

        function renderAdminNav() {
            return `
            <nav>
                <h2>AB MOTORS</h2>
                <div class="nav-links">
                    <a class="${state.route === '/admin/config' ? 'active' : ''}" onclick="navigate('/admin/config')">Configuration</a>
                    <a class="${state.route === '/admin/dates' ? 'active' : ''}" onclick="navigate('/admin/dates')">Dates Dispo</a>
                    <a class="${state.route === '/admin/bookings' ? 'active' : ''}" onclick="navigate('/admin/bookings')">Réservations</a>
                    <a class="${state.route === '/admin/messages' ? 'active' : ''}" onclick="navigate('/admin/messages')">Messages Clients</a>
                    <a class="${state.route === '/admin/stats' ? 'active' : ''}" onclick="navigate('/admin/stats')">Statistiques</a>
                    <a class="${state.route === '/admin/accounts' ? 'active' : ''}" onclick="navigate('/admin/accounts')">Comptes</a>
                </div>
                <div class="nav-actions">
                    <button class="icon-btn" onclick="navigate('/admin/messages')">🔔</button>
                    <button class="icon-btn" onclick="navigate('/admin/accounts')">👤</button>
                    <button class="btn-danger" onclick="logout()">Déconnexion</button>
                </div>
            </nav>`;
        }

        function renderClientNav() {
            return `
            <nav>
                <h2>AB MOTORS</h2>
                <div class="nav-actions">
                    <span style="margin-right: 1rem;">${state.user.name}</span>
                    <button class="btn-danger" onclick="logout()">Déconnexion</button>
                </div>
            </nav>`;
        }

        function renderAdminContent() {
            if (state.route === '/admin/stats') return renderStats();
            if (state.route === '/admin/bookings') return renderBookings();
            if (state.route === '/admin/accounts') return renderAccounts();
            if (state.route === '/admin/dates') return renderDatesSetup();
            return `<div class="container"><div class="panel">Sélectionnez une rubrique dans le menu.</div></div>`;
        }

        function renderClientContent() {
            // Vue client par défaut (toutes options activées comme demandé)
            return `
            <div class="container">
                <div class="panel">
                    <h2>Réserver votre traversée</h2>
                    <br>
                    <div style="display:flex; gap:1rem;">
                        <div style="flex:1;">
                            <label>Trajet</label>
                            <select><option>Anjouan vers Moheli</option><option>Moheli vers Anjouan</option></select>
                        </div>
                        <div style="flex:1;">
                            <label>Adultes</label>
                            <input type="number" value="1" min="1">
                        </div>
                        <div style="flex:1;">
                            <label>Enfants -13 ans</label>
                            <input type="number" value="0" min="0">
                        </div>
                    </div>
                    <button class="btn-success">Confirmer la réservation</button>
                </div>
            </div>`;
        }

        // --- VUES ADMIN DETAILLEES ---

        function renderStats() {
            // Filtrer uniquement les payés
            const validOrders = state.data.reservations.filter(r => r.Statut === 'Validé et payé');
            
            // Logique de calcul des stats (Jour, Semaine, Mois, Année) par montants et passagers
            let revToday = 0, revWeek = 0, revMonth = 0, revYear = 0;
            let paxToday = {a:0, e:0}, paxWeek = {a:0, e:0}, paxMonth = {a:0, e:0}, paxYear = {a:0, e:0};
            
            const now = new Date();
            validOrders.forEach(o => {
                const d = new Date(o.Date);
                const amt = parseFloat(o.Montant) || 0;
                const ad = parseInt(o.Adultes) || 0;
                const enf = parseInt(o.Enfants) || 0;

                // Simple check pour l'année et le mois
                if (d.getFullYear() === now.getFullYear()) {
                    revYear += amt; paxYear.a += ad; paxYear.e += enf;
                    if (d.getMonth() === now.getMonth()) {
                        revMonth += amt; paxMonth.a += ad; paxMonth.e += enf;
                        if (d.toDateString() === now.toDateString()) {
                            revToday += amt; paxToday.a += ad; paxToday.e += enf;
                        }
                    }
                }
            });

            return `
            <div class="container">
                <div class="panel">
                    <h2>Statistiques et Rapports (Validés)</h2>
                    <br>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <h3>Aujourd'hui ${now.toLocaleDateString()}</h3>
                            <div class="value">${convertToKMF(revToday)}</div>
                            <small>${paxToday.a} Adultes, ${paxToday.e} Enfants</small>
                        </div>
                        <div class="stat-card">
                            <h3>Ce Mois-ci</h3>
                            <div class="value">${convertToKMF(revMonth)}</div>
                            <small>${paxMonth.a} Adultes, ${paxMonth.e} Enfants</small>
                        </div>
                        <div class="stat-card">
                            <h3>Cette Année ${now.getFullYear()}</h3>
                            <div class="value">${convertToKMF(revYear)}</div>
                            <small>${paxYear.a} Adultes, ${paxYear.e} Enfants</small>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderBookings() {
            let trs = state.data.reservations.map(r => `
                <tr>
                    <td>${r.Id}</td>
                    <td>${r.Client}</td>
                    <td>${r.Trajet} | ${r.Date}</td>
                    <td>${r.Adultes} Adulte, ${r.Enfants} Enfant</td>
                    <td>${convertToKMF(r.Montant)}</td>
                    <td>${r.Statut}</td>
                    <td><button class="btn-success">Renvoiyer Facture PDF</button></td>
                </tr>
            `).join('');

            return `
            <div class="container">
                <div class="panel">
                    <h2>Suivi des Réservations</h2>
                    <table>
                        <thead><tr><th>ID</th><th>Client</th><th>Trajet & Date</th><th>Pax</th><th>Total</th><th>Statut</th><th>Action</th></tr></thead>
                        <tbody>${trs}</tbody>
                    </table>
                </div>
            </div>`;
        }

        function renderAccounts() {
            const activeUsers = state.data.users.filter(u => u.Status !== 'Archived');
            const archivedUsers = state.data.users.filter(u => u.Status === 'Archived');

            let activeTrs = activeUsers.map(u => `<tr><td>${u.Name}</td><td>${u.Email}</td><td>Actif</td><td><button class="btn-danger" onclick="archiveUser('${u.Id}')">Archiver/Désactiver</button></td></tr>`).join('');
            let archivedTrs = archivedUsers.map(u => `<tr><td>${u.Name}</td><td>${u.Email}</td><td>Archivé</td><td>Aucune action possible</td></tr>`).join('');

            return `
            <div class="container">
                <div class="panel">
                    <h2>Gestion des Comptes Clients</h2>
                    <br>
                    <h3>Comptes Actifs</h3>
                    <table>
                        <thead><tr><th>Client</th><th>Contact</th><th>Statut</th><th>Action</th></tr></thead>
                        <tbody>${activeTrs}</tbody>
                    </table>
                    <br><br>
                    <h3 style="color: var(--accent-red);">Comptes Désactivés / Archivés</h3>
                    <table>
                        <thead><tr><th>Client</th><th>Contact</th><th>Statut</th><th>Action</th></tr></thead>
                        <tbody>${archivedTrs}</tbody>
                    </table>
                </div>
            </div>`;
        }

        function renderDatesSetup() {
            return `
            <div class="container">
                <div class="panel">
                    <h2>Disponibilités & Heures</h2>
                    <p style="color: var(--text-muted); margin-bottom: 1rem;">Sélectionnez une ou plusieurs dates (cliquez pour marquer visuellement).</p>
                    <div class="date-grid">
                        <div class="date-cell" onclick="toggleDateSelection(this)">1</div>
                        <div class="date-cell" onclick="toggleDateSelection(this)">2</div>
                        <div class="date-cell" onclick="toggleDateSelection(this)">3</div>
                        <div class="date-cell" onclick="toggleDateSelection(this)">4</div>
                        <div class="date-cell" onclick="toggleDateSelection(this)">5</div>
                        <div class="date-cell" onclick="toggleDateSelection(this)">6</div>
                        <div class="date-cell" onclick="toggleDateSelection(this)">7</div>
                    </div>
                    <div style="display:flex; gap: 1rem; margin-top: 1rem;">
                        <label><input type="checkbox" checked> Ouvert le Matin (08:00)</label>
                        <label><input type="checkbox"> Ouvert l'Après midi (14:30)</label>
                    </div>
                    <br>
                    <button class="btn-success">Publier ces horaires</button>
                </div>
            </div>`;
        }

        // Lancement de l'application
        render();
        if (state.user && state.user.role === 'Admin') loadData();
    </script>
</body>
</html>
