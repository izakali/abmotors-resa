      refresh: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6v5h-5M4 18v-5h5"/><path d="M6.1 8a7 7 0 0 1 11.7-2L20 11M4 13l2.2 5a7 7 0 0 0 11.7-2"/></svg>',
      phone: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h3l1.3 4-2 1.5a15 15 0 0 0 6.2 6.2l1.5-2L21 14v3a4 4 0 0 1-4 4A14 14 0 0 1 3 7a4 4 0 0 1 4-4Z"/></svg>',
      mail: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>'
    };

    const state = {
      publicData: { dates: {}, settings: {} },
      token: '',
      user: null,
      clientView: 'reserve',
      adminView: 'dashboard',
      bookings: [],
      adminData: null,
      adminChatId: '',
      authTab: 'login',
      resetCodeRequested: false,
      chatOpen: false,
      chatData: { chat: null, messages: [] },
      autoRefreshTimer: null,
      mobileNavOpen: false,
      booking: {
        step: 1,
        tripType: 'oneway',
        departure: 'Anjouan',
        arrival: 'Mohéli',
        departureDate: '',
        departureSlot: '',
        returnDate: '',
        returnSlot: '',
        adults: 1,
        children: 0,
        baggageCount: 0,
        passengers: []
      }
    };

    function icon(name) {
      return ICONS[name] || '';
    }

    function escapeHTML(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttribute(value) {
      return escapeHTML(value).replace(/`/g, '&#096;');
    }

    function localDateString(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDate(value, withTime = false) {
      if (!value) return 'Non renseigné';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return new Intl.DateTimeFormat('fr-FR', withTime ? {
        dateStyle: 'medium',
        timeStyle: 'short',
        timeZone: 'Indian/Comoro'
      } : {
        dateStyle: 'medium',
        timeZone: 'Indian/Comoro'
      }).format(date);
    }

    function formatDateKey(value) {
      if (!value) return 'Date non sélectionnée';
      const date = new Date(`${value}T12:00:00+03:00`);
      return new Intl.DateTimeFormat('fr-FR', { dateStyle: 'full', timeZone: 'Indian/Comoro' }).format(date);
    }

    function formatMoney(value) {
      return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(Number(value || 0));
    }

    function persistSession() {
      if (state.token && state.user) {
        localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({ token: state.token, user: state.user }));
      } else {
        localStorage.removeItem(SESSION_STORAGE_KEY);
      }
    }

    function restoreSession() {
      try {
        const stored = JSON.parse(localStorage.getItem(SESSION_STORAGE_KEY));
        if (stored && stored.token) {
          state.token = stored.token;
          state.user = stored.user || null;
        }
      } catch (error) {
        localStorage.removeItem(SESSION_STORAGE_KEY);
      }
    }

    async function api(action, payload = {}, options = {}) {
      const body = { action, ...payload };
      if (options.auth !== false && state.token) body.token = state.token;
      const response = await fetch(GOOGLE_WEB_APP_URL, {
        method: 'POST',
        redirect: 'follow',
        body: JSON.stringify(body)
      });
      if (!response.ok) throw new Error('Le serveur est indisponible');
      const json = await response.json();
      if (!json.ok) {
        if (/Session expirée|Connexion requise/.test(json.error || '') && !options.keepSession) {
          clearSession(false);
        }
        throw new Error(json.error || 'Une erreur est survenue');
      }
      return json.data;
    }

    function toast(message, type = 'success') {
      const root = document.getElementById('toast-root');
      const element = document.createElement('div');
      element.className = `toast ${type}`;
      element.innerHTML = `<div style="color:${type === 'error' ? 'var(--danger)' : 'var(--primary)'}">${icon(type === 'error' ? 'close' : 'check')}</div><p>${escapeHTML(message)}</p>`;
      root.appendChild(element);
      setTimeout(() => element.remove(), 4600);
    }

    function setLoading(button, loading, label) {
      if (!button) return;
      if (loading) {
        button.dataset.original = button.innerHTML;
        button.disabled = true;
        button.innerHTML = `<span class="spinner" style="width:20px;height:20px;margin:0"></span><span>${escapeHTML(label || 'Traitement')}</span>`;
      } else {
        button.disabled = false;
        if (button.dataset.original) button.innerHTML = button.dataset.original;
      }
    }

    async function bootstrap() {
      restoreSession();
      try {
        state.publicData = await api('public_data', {}, { auth: false, keepSession: true });
      } catch (error) {
        document.getElementById('app').innerHTML = `<div class="empty-state"><div class="empty-icon">${icon('close')}</div><h2>Connexion au serveur impossible</h2><p>${escapeHTML(error.message)}</p><button class="button button-primary" onclick="location.reload()">Réessayer</button></div>`;
        return;
      }

      if (state.token) {
        try {
          const data = await api('session_info');
          state.user = data.user;
          persistSession();
        } catch (error) {
          clearSession(false);
        }
      }

      if (state.user?.role === 'admin') {
        await loadAdminData(true);
        renderAdminShell();
      } else {
        renderClientShell();
      }
      scheduleAutoRefresh();
    }

    function clearSession(render = true) {
      state.token = '';
      state.user = null;
      state.bookings = [];
      state.adminData = null;
      state.chatOpen = false;
      state.chatData = { chat: null, messages: [] };
      persistSession();
      if (render) renderClientShell();
    }

    async function logout() {
      try { await api('logout'); } catch (error) {}
      clearSession(true);
      toast('Vous êtes déconnecté');
    }

    function renderClientShell() {
      document.body.classList.remove('admin-mode');
      const settings = state.publicData.settings || {};
      document.getElementById('app').className = '';
      document.getElementById('app').innerHTML = `
        <div class="top-stripe"></div>
        <header class="client-header">
          <div class="nav-wrap">
            <div class="brand" onclick="setClientView('reserve')">
              <div class="brand-mark">AB</div>
              <div class="brand-copy"><strong>AB MOTORS</strong><span>Transport maritime inter-îles</span></div>
            </div>
            <nav id="client-nav" class="client-nav ${state.mobileNavOpen ? 'open' : ''}">
              ${settings.moduleReservation ? navButton('reserve', 'Réserver', 'calendar') : ''}
              ${settings.moduleManage ? navButton('manage', 'Gérer ma réservation', 'ticket') : ''}
              ${settings.moduleHelp ? navButton('help', 'Aide', 'help') : ''}
            </nav>
            <div class="nav-actions">
              <button class="icon-button mobile-menu-button" aria-label="Ouvrir le menu" onclick="toggleMobileNav()">${icon('menu')}</button>
              ${state.user ? `
                <button class="button button-secondary" onclick="setClientView('manage')">${icon('user')}<span>${escapeHTML(firstName(state.user.fullName))}</span></button>
                <button class="icon-button" aria-label="Se déconnecter" onclick="logout()">${icon('logout')}</button>
              ` : `
                <button class="button button-secondary" onclick="openAuth('login')">${icon('login')}<span>Se connecter</span></button>
              `}
            </div>
          </div>
        </header>
        <main id="client-main" class="client-main"></main>
      `;
      renderClientView();
      renderChatRoot();
    }

    function firstName(name) {
      return String(name || 'Compte').trim().split(/\s+/)[0];
    }

    function navButton(view, label, iconName) {
      return `<button class="nav-link ${state.clientView === view ? 'active' : ''}" onclick="setClientView('${view}')">${label}</button>`;
    }

    function toggleMobileNav() {
      state.mobileNavOpen = !state.mobileNavOpen;
      document.getElementById('client-nav')?.classList.toggle('open', state.mobileNavOpen);
    }

    function setClientView(view) {
      const settings = state.publicData.settings || {};
      if (view === 'reserve' && !settings.moduleReservation) return;
      if (view === 'manage' && !settings.moduleManage) return;
      if (view === 'help' && !settings.moduleHelp) return;
      state.clientView = view;
      state.mobileNavOpen = false;
      renderClientShell();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      if (view === 'manage' && state.user) loadMyBookings();
    }

    function renderClientView() {
      const main = document.getElementById('client-main');
      if (!main) return;
      if (state.clientView === 'manage') main.innerHTML = renderManageView();
      else if (state.clientView === 'help') main.innerHTML = renderHelpView();
      else main.innerHTML = renderReserveView();
    }

    function renderReserveView() {
      const settings = state.publicData.settings || {};
      if (!settings.moduleReservation) return renderDisabledFeature('Les réservations sont temporairement désactivées');
      return `
        <section class="hero-grid">
          <div class="hero-copy">
            <div class="eyebrow"><span class="eyebrow-dot"></span>Réservation sécurisée</div>
            <h1 class="hero-title">Voyagez entre <span>Anjouan et Mohéli.</span></h1>
            <p class="hero-text">Consultez les places disponibles le matin et l’après-midi, vérifiez l’heure de départ, puis réservez depuis votre compte AB MOTORS.</p>
            <div class="hero-points">
              <div class="mini-stat"><strong>Compte obligatoire</strong><span>Réservation liée à votre identité</span></div>
              <div class="mini-stat"><strong>Horaires visibles</strong><span>Départ matin et après-midi</span></div>
              <div class="mini-stat"><strong>Gestion en ligne</strong><span>Annulation depuis votre espace</span></div>
            </div>
            ${renderUpcomingAvailability()}
          </div>
          <div class="panel booking-panel">${renderBookingWizard()}</div>
        </section>
      `;
    }

    function renderDisabledFeature(message) {
      return `<div class="panel content-panel empty-state"><div class="empty-icon">${icon('controls')}</div><h2>Service indisponible</h2><p>${escapeHTML(message)}</p></div>`;
    }

    function renderUpcomingAvailability() {
      const dates = Object.entries(state.publicData.dates || {})
        .filter(([date, config]) => date >= localDateString() && (config.m || config.a))
        .sort(([a], [b]) => a.localeCompare(b))
        .slice(0, 4);
      if (!dates.length) return `<div class="notice notice-info" style="margin-top:28px">Aucune date n’est ouverte pour le moment. Les disponibilités sont mises à jour automatiquement.</div>`;
      return `<div class="availability-list">${dates.map(([date, config]) => `
        <div class="availability-row">
          <strong>${escapeHTML(formatDateKey(date))}</strong>
          <div class="availability-slot"><i style="background:${config.m ? 'var(--primary)' : 'var(--danger)'}"></i>Matin ${config.m ? `à ${escapeHTML(config.morningTime)}` : 'indisponible'}</div>
          <div class="availability-slot"><i style="background:${config.a ? 'var(--primary)' : 'var(--danger)'}"></i>Après-midi ${config.a ? `à ${escapeHTML(config.afternoonTime)}` : 'indisponible'}</div>
        </div>
      `).join('')}</div>`;
    }

    function renderBookingWizard() {
      const step = state.booking.step;
      return `
        <div class="panel-header">
          <div><h2>Réserver une traversée</h2><p>${step === 1 ? 'Trajet, date et disponibilité' : step === 2 ? 'Passagers et bagages' : 'Vérification de la demande'}</p></div>
          <div class="step-pill">Étape ${step} sur 3</div>
        </div>
        ${step === 1 ? renderBookingStepOne() : step === 2 ? renderBookingStepTwo() : renderBookingStepThree()}
      `;
    }

    function renderBookingStepOne() {
      const b = state.booking;
      return `
        <div class="field field-full" style="margin-bottom:14px">
          <label>Type de voyage</label>
          <div class="segmented">
            <button class="segment ${b.tripType === 'oneway' ? 'active' : ''}" onclick="setBookingTripType('oneway')">Aller simple</button>
            <button class="segment ${b.tripType === 'roundtrip' ? 'active' : ''}" onclick="setBookingTripType('roundtrip')">Aller-retour</button>
          </div>
        </div>
        <div class="form-grid">
          <div class="field"><label>Départ</label><select class="control" onchange="setDeparture(this.value)"><option ${b.departure === 'Anjouan' ? 'selected' : ''}>Anjouan</option><option ${b.departure === 'Mohéli' ? 'selected' : ''}>Mohéli</option></select></div>
          <div class="field"><label>Arrivée</label><div style="display:grid;grid-template-columns:1fr 50px;gap:8px"><input class="control" value="${escapeAttribute(b.arrival)}" disabled><button class="icon-button" onclick="swapRoute()" aria-label="Inverser le trajet">${icon('swap')}</button></div></div>
          <div class="field field-full"><label>Date de l’aller</label><input type="date" class="control" min="${localDateString()}" value="${escapeAttribute(b.departureDate)}" onchange="setBookingDate('departure', this.value)"></div>
          <div class="field field-full"><label>Départ disponible</label>${renderSlotSelector(b.departureDate, b.departureSlot, 'departure')}</div>
          ${b.tripType === 'roundtrip' ? `
            <div class="field field-full"><label>Date du retour</label><input type="date" class="control" min="${escapeAttribute(b.departureDate || localDateString())}" value="${escapeAttribute(b.returnDate)}" onchange="setBookingDate('return', this.value)"></div>
            <div class="field field-full"><label>Départ disponible pour le retour</label>${renderSlotSelector(b.returnDate, b.returnSlot, 'return')}</div>
          ` : ''}
          <div class="field field-full">
            <label>Nombre de voyageurs</label>
            <div class="summary-box">
              ${counterRow('Adultes', `Tarif ${formatMoney(state.publicData.settings.priceAdult)}`, 'adults', b.adults, 1)}
              ${counterRow('Enfants', `Tarif ${formatMoney(state.publicData.settings.priceChild)}`, 'children', b.children, 0)}
            </div>
          </div>
        </div>
        <div class="notice notice-info" style="margin-top:15px">Vous pouvez consulter les disponibilités sans compte. Une connexion est exigée avant la saisie des passagers.</div>
        <div class="form-actions"><button class="button button-primary button-block" onclick="goBookingStepTwo()">Continuer ${icon('arrow')}</button></div>
      `;
    }

    function renderSlotSelector(date, selected, kind) {
      if (!date) return `<div class="notice">Sélectionnez une date pour afficher les départs.</div>`;
      const config = state.publicData.dates?.[date];
      if (!config || (!config.m && !config.a)) return `<div class="notice notice-danger">Aucun départ n’est disponible pour cette date.</div>`;
      return `<div class="slot-grid">
        ${slotCard(kind, 'morning', 'Matin', config.morningTime, config.morningRemaining, config.m, selected)}
        ${slotCard(kind, 'afternoon', 'Après-midi', config.afternoonTime, config.afternoonRemaining, config.a, selected)}
      </div>`;
    }

    function slotCard(kind, slot, label, time, remaining, available, selected) {
      return `<button class="slot-card ${selected === slot ? 'active' : ''}" ${available ? `onclick="selectBookingSlot('${kind}','${slot}')"` : 'disabled'}>
        <strong>${label}</strong>
        <div class="slot-time">${available ? escapeHTML(time) : 'Indisponible'}</div>
        <div class="slot-remaining">${available ? `${Number(remaining || 0)} places restantes` : 'Créneau fermé'}</div>
      </button>`;
    }

    function counterRow(label, subtitle, key, value, minimum) {
      return `<div class="counter-row"><div class="counter-copy"><strong>${label}</strong><span>${subtitle}</span></div><div class="counter"><button onclick="changeBookingCount('${key}',-1,${minimum})">−</button><strong>${value}</strong><button onclick="changeBookingCount('${key}',1,${minimum})">+</button></div></div>`;
    }

    function setBookingTripType(type) {
      state.booking.tripType = type;
      if (type === 'oneway') {
        state.booking.returnDate = '';
        state.booking.returnSlot = '';
      }
      renderClientView();
    }

    function setDeparture(value) {
      state.booking.departure = value;
      state.booking.arrival = value === 'Anjouan' ? 'Mohéli' : 'Anjouan';
      renderClientView();
    }

    function swapRoute() {
      const old = state.booking.departure;
      state.booking.departure = state.booking.arrival;
      state.booking.arrival = old;
      renderClientView();
    }

    function setBookingDate(kind, value) {
      if (kind === 'departure') {
        state.booking.departureDate = value;
        state.booking.departureSlot = '';
        if (state.booking.returnDate && state.booking.returnDate < value) {
          state.booking.returnDate = '';
          state.booking.returnSlot = '';
        }
      } else {
        state.booking.returnDate = value;
        state.booking.returnSlot = '';
      }
      renderClientView();
    }

    function selectBookingSlot(kind, slot) {
      if (kind === 'departure') state.booking.departureSlot = slot;
      else state.booking.returnSlot = slot;
      renderClientView();
    }

    function changeBookingCount(key, delta, minimum) {
      const current = Number(state.booking[key] || 0);
      state.booking[key] = Math.max(minimum, Math.min(50, current + delta));
      renderClientView();
    }

    function validateBookingAvailability() {
      const b = state.booking;
      if (!b.departureDate || !b.departureSlot) throw new Error('Sélectionnez la date et le départ de l’aller');
      const outbound = state.publicData.dates?.[b.departureDate];
      const outboundAvailable = b.departureSlot === 'morning' ? outbound?.m : outbound?.a;
      if (!outboundAvailable) throw new Error('Le départ sélectionné n’est plus disponible');
      const seats = b.adults + b.children;
      const outboundRemaining = b.departureSlot === 'morning' ? outbound.morningRemaining : outbound.afternoonRemaining;
      if (outboundRemaining < seats) throw new Error('Le nombre de places restantes est insuffisant');
      if (b.tripType === 'roundtrip') {
        if (!b.returnDate || !b.returnSlot) throw new Error('Sélectionnez la date et le départ du retour');
        const inbound = state.publicData.dates?.[b.returnDate];
        const inboundAvailable = b.returnSlot === 'morning' ? inbound?.m : inbound?.a;
        if (!inboundAvailable) throw new Error('Le retour sélectionné n’est plus disponible');
        const inboundRemaining = b.returnSlot === 'morning' ? inbound.morningRemaining : inbound.afternoonRemaining;
        if (inboundRemaining < seats) throw new Error('Le nombre de places restantes pour le retour est insuffisant');
      }
    }

    function goBookingStepTwo() {
      try { validateBookingAvailability(); } catch (error) { toast(error.message, 'error'); return; }
      if (!state.user) {
        openAuth('login');
        toast('Connectez-vous pour poursuivre la réservation', 'error');
        return;
      }
      const total = state.booking.adults + state.booking.children;
      const previous = state.booking.passengers || [];
      state.booking.passengers = Array.from({ length: total }, (_, index) => {
        const type = index < state.booking.adults ? 'Adulte' : 'Enfant';
        return previous[index] || { type, firstName: '', lastName: '' };
      }).map((p, index) => ({ ...p, type: index < state.booking.adults ? 'Adulte' : 'Enfant' }));
      state.booking.step = 2;
      renderClientView();
    }

    function renderBookingStepTwo() {
      const settings = state.publicData.settings || {};
      return `
        <div>${state.booking.passengers.map((passenger, index) => `
          <div class="passenger-card">
            <div class="passenger-title"><strong>Passager ${index + 1}</strong><span>${passenger.type}</span></div>
            <div class="form-grid">
              <div class="field"><label>Prénom</label><input class="control" value="${escapeAttribute(passenger.firstName)}" oninput="updatePassenger(${index},'firstName',this.value)" placeholder="Prénom"></div>
              <div class="field"><label>Nom</label><input class="control" value="${escapeAttribute(passenger.lastName)}" oninput="updatePassenger(${index},'lastName',this.value)" placeholder="Nom"></div>
            </div>
          </div>
        `).join('')}</div>
        ${settings.moduleBaggage ? `
          <div class="field" style="margin-top:15px"><label>Bagages</label>
            <div class="summary-box">
              ${counterRow('Nombre de bagages', `${formatMoney(settings.priceBaggage)} par bagage et par traversée`, 'baggageCount', state.booking.baggageCount, 0)}
            </div>
          </div>
        ` : ''}
        <div class="form-actions">
          <button class="button button-secondary" onclick="setBookingStep(1)">${icon('arrowLeft')} Retour</button>
          <button class="button button-primary" onclick="goBookingStepThree()">Vérifier ${icon('arrow')}</button>
        </div>
      `;
    }

    function updatePassenger(index, key, value) {
      if (state.booking.passengers[index]) state.booking.passengers[index][key] = value;
    }

    function setBookingStep(step) {
      state.booking.step = step;
      renderClientView();
    }

    function goBookingStepThree() {
      const invalid = state.booking.passengers.some(p => String(p.firstName).trim().length < 2 || String(p.lastName).trim().length < 2);
      if (invalid) {
        toast('Renseignez le prénom et le nom de chaque passager', 'error');
        return;
      }
      state.booking.step = 3;
      renderClientView();
    }

    function bookingTotal() {
      const s = state.publicData.settings || {};
      const legs = state.booking.tripType === 'roundtrip' ? 2 : 1;
      return ((state.booking.adults * Number(s.priceAdult || 0)) + (state.booking.children * Number(s.priceChild || 0)) + (state.booking.baggageCount * Number(s.priceBaggage || 0))) * legs;
    }

    function selectedSlotTime(date, slot) {
      const config = state.publicData.dates?.[date];
      if (!config) return '';
      return slot === 'morning' ? config.morningTime : config.afternoonTime;
    }

    function renderBookingStepThree() {
      const b = state.booking;
      return `
        <div class="summary-box">
          <div class="summary-line"><span>Compte</span><strong>${escapeHTML(state.user?.fullName || '')}</strong></div>
          <div class="summary-line"><span>Trajet</span><strong>${escapeHTML(b.departure)} vers ${escapeHTML(b.arrival)}</strong></div>
          <div class="summary-line"><span>Aller</span><strong>${escapeHTML(formatDateKey(b.departureDate))} à ${escapeHTML(selectedSlotTime(b.departureDate, b.departureSlot))}</strong></div>
          ${b.tripType === 'roundtrip' ? `<div class="summary-line"><span>Retour</span><strong>${escapeHTML(formatDateKey(b.returnDate))} à ${escapeHTML(selectedSlotTime(b.returnDate, b.returnSlot))}</strong></div>` : ''}
          <div class="summary-line"><span>Voyageurs</span><strong>${b.adults} adulte${b.adults > 1 ? 's' : ''}${b.children ? ` et ${b.children} enfant${b.children > 1 ? 's' : ''}` : ''}</strong></div>
          <div class="summary-line"><span>Bagages</span><strong>${b.baggageCount}</strong></div>
          <div class="summary-line"><span>Total</span><strong class="summary-total">${formatMoney(bookingTotal())}</strong></div>
        </div>
        <div class="notice notice-info" style="margin-top:14px">La demande sera enregistrée en attente de validation par AB MOTORS.</div>
        <div class="form-actions">
          <button class="button button-secondary" onclick="setBookingStep(2)">${icon('arrowLeft')} Modifier</button>
          <button id="booking-submit" class="button button-primary" onclick="submitBooking()">Confirmer ${icon('check')}</button>
        </div>
      `;
    }

    async function submitBooking() {
      const button = document.getElementById('booking-submit');
      setLoading(button, true, 'Enregistrement');
      try {
        validateBookingAvailability();
        const data = await api('new_booking', {
          tripType: state.booking.tripType,
          departure: state.booking.departure,
          arrival: state.booking.arrival,
          departureDate: state.booking.departureDate,
          departureSlot: state.booking.departureSlot,
          returnDate: state.booking.returnDate,
          returnSlot: state.booking.returnSlot,
          adults: state.booking.adults,
          children: state.booking.children,
          baggageCount: state.booking.baggageCount,
          passengers: state.booking.passengers
        });
        toast(`Réservation ${data.bookingId} enregistrée`);
        state.booking = {
          step: 1, tripType: 'oneway', departure: 'Anjouan', arrival: 'Mohéli', departureDate: '', departureSlot: '',
          returnDate: '', returnSlot: '', adults: 1, children: 0, baggageCount: 0, passengers: []
        };
        state.clientView = 'manage';
        await loadPublicDataSilently();
        await loadMyBookings(true);
        renderClientShell();
      } catch (error) {
        toast(error.message, 'error');
        setLoading(button, false);
      }
    }

    function renderManageView() {
      const settings = state.publicData.settings || {};
      if (!settings.moduleManage) return renderDisabledFeature('La gestion des réservations est temporairement désactivée');
      if (!state.user) {
        return `
          <div class="page-head"><div><h1>Gérer ma réservation</h1><p>Consultez et annulez vos traversées depuis votre compte.</p></div></div>
          <div class="panel content-panel empty-state"><div class="empty-icon">${icon('user')}</div><h2>Connexion requise</h2><p>Connectez-vous avec votre adresse e-mail et votre mot de passe.</p><button class="button button-primary" onclick="openAuth('login')">${icon('login')} Se connecter</button></div>
        `;
      }
      return `
        <div class="page-head"><div><div class="eyebrow"><span class="eyebrow-dot"></span>Espace personnel</div><h1>Mes réservations</h1><p>Annulation sans pénalité jusqu’à ${Number(settings.cancellationLimitHours || 2)} heures avant le départ.</p></div><button class="button button-secondary" onclick="loadMyBookings()">${icon('refresh')} Actualiser</button></div>
        <div class="panel content-panel">
          ${state.bookings.length ? `<div class="reservation-list">${state.bookings.map(renderReservationCard).join('')}</div>` : `<div class="empty-state"><div class="empty-icon">${icon('ticket')}</div><h2>Aucune réservation</h2><p>Vos demandes apparaîtront ici après leur enregistrement.</p><button class="button button-primary" onclick="setClientView('reserve')">Réserver une traversée</button></div>`}
        </div>
      `;
    }

    function bookingBadge(status) {
      const value = String(status || '');
      if (/annul/i.test(value)) return 'badge-danger';
      if (/payée|confirmée/i.test(value)) return 'badge-success';
      return 'badge-pending';
    }

    function renderReservationCard(booking) {
      const cancelled = /annul/i.test(booking.status || '');
      const departure = booking.departureISO ? new Date(booking.departureISO) : null;
      const canCancel = !cancelled && departure && departure.getTime() > Date.now();
      return `
        <article class="reservation-card">
          <div class="reservation-top">
            <div><div class="reservation-id">${escapeHTML(booking.id)}</div><h3>${escapeHTML(booking.details)}</h3><p>Créée le ${escapeHTML(formatDate(booking.createdAt, true))}</p></div>
            <span class="badge ${bookingBadge(booking.status)}">${escapeHTML(booking.status)}</span>
          </div>
          <div class="reservation-meta">
            <div><span>Départ</span><strong>${escapeHTML(formatDate(booking.departureISO, true))}</strong></div>
            <div><span>Passagers</span><strong>${escapeHTML(booking.pax)}</strong></div>
            <div><span>Bagages</span><strong>${Number(booking.baggageCount || 0)}</strong></div>
            <div><span>Total</span><strong>${formatMoney(booking.total)}</strong></div>
          </div>
          ${Number(booking.cancellationPenalty || 0) > 0 ? `<div class="notice notice-danger" style="margin-top:13px">Pénalité d’annulation ${formatMoney(booking.cancellationPenalty)}</div>` : ''}
          ${canCancel ? `<div class="reservation-actions"><button class="button button-danger button-small" onclick="cancelBooking('${escapeAttribute(booking.id)}')">${icon('close')} Annuler la réservation</button></div>` : ''}
        </article>
      `;
    }

    async function loadMyBookings(silent = false) {
      if (!state.user || state.user.role !== 'client') return;
      try {
        const data = await api('get_my_bookings');
        state.bookings = data.bookings || [];
        if (!silent && state.clientView === 'manage') renderClientView();
      } catch (error) {
        if (!silent) toast(error.message, 'error');
      }
    }

    async function cancelBooking(id) {
      const booking = state.bookings.find(item => item.id === id);
      if (!booking) return;
      const settings = state.publicData.settings || {};
      const hours = booking.departureISO ? (new Date(booking.departureISO).getTime() - Date.now()) / 3600000 : 999;
      const penalty = hours < Number(settings.cancellationLimitHours || 2) ? Number(settings.cancellationPenalty || 10) : 0;
      const message = penalty > 0
        ? `Cette annulation entraîne une pénalité de ${formatMoney(penalty)}. Confirmer l’annulation`
        : 'Confirmer l’annulation de cette réservation';
      if (!confirm(message)) return;
      try {
        const data = await api('cancel_booking', { bookingId: id });
        toast(data.penalty > 0 ? `Réservation annulée avec une pénalité de ${formatMoney(data.penalty)}` : 'Réservation annulée');
        await loadPublicDataSilently();
        await loadMyBookings(true);
        renderClientView();
      } catch (error) {
        toast(error.message, 'error');
      }
    }

    function renderHelpView() {
      const settings = state.publicData.settings || {};
      if (!settings.moduleHelp) return renderDisabledFeature('L’aide est temporairement désactivée');
      return `
        <div class="page-head"><div><div class="eyebrow"><span class="eyebrow-dot"></span>Assistance</div><h1>Aide et service client</h1><p>Retrouvez les règles essentielles avant votre traversée.</p></div></div>
        <div class="help-grid">
          <div class="faq-list">
            <article class="faq-item"><h3>Le compte est-il obligatoire</h3><p>Oui. Les disponibilités restent consultables librement, mais la validation d’une réservation nécessite un compte client connecté.</p></article>
            <article class="faq-item"><h3>Où voir l’heure de départ</h3><p>L’heure exacte apparaît dans le créneau matin ou après-midi, dans le récapitulatif et dans la rubrique Gérer ma réservation.</p></article>
            <article class="faq-item"><h3>Comment annuler</h3><p>Ouvrez Gérer ma réservation puis utilisez le bouton d’annulation. Une annulation effectuée moins de ${Number(settings.cancellationLimitHours || 2)} heures avant le départ entraîne une pénalité de ${formatMoney(settings.cancellationPenalty)}.</p></article>
            <article class="faq-item"><h3>Quel est le prix des bagages</h3><p>Le tarif actuel est de ${formatMoney(settings.priceBaggage)} par bagage et par traversée. Le montant est calculé automatiquement dans le récapitulatif.</p></article>
            <article class="faq-item"><h3>Réinitialisation du mot de passe</h3><p>Deux demandes sont autorisées. Une troisième demande suspend automatiquement le compte et nécessite une intervention du service client.</p></article>
          </div>
          <aside class="panel support-card">
            <h2>Contacter AB MOTORS</h2>
            <p>Le service client répond directement depuis la messagerie intégrée.</p>
            <div class="support-line">${icon('phone')}<span>${escapeHTML(settings.supportPhone || 'Non renseigné')}</span></div>
            <div class="support-line">${icon('mail')}<span>${escapeHTML(settings.supportEmail || 'Non renseigné')}</span></div>
            ${settings.moduleChat ? `<button class="button button-primary button-block" style="margin-top:16px" onclick="openChat()">${icon('chat')} Ouvrir la messagerie</button>` : ''}
          </aside>
        </div>
      `;
    }

    function openAuth(tab = 'login') {
      state.authTab = tab;
      if (tab !== 'reset') state.resetCodeRequested = false;
      renderAuthModal();
      const modal = document.getElementById('auth-modal');
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
    }

    function closeAuth() {
      const modal = document.getElementById('auth-modal');
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
    }

    function setAuthTab(tab) {
      state.authTab = tab;
      if (tab !== 'reset') state.resetCodeRequested = false;
      renderAuthModal();
    }

    function renderAuthModal() {
      const modal = document.getElementById('auth-modal');
      const registrationEnabled = state.publicData.settings?.moduleRegistration !== false;
      modal.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true">
          <div class="modal-header"><div><div class="eyebrow">Espace sécurisé</div><h2>Connexion AB MOTORS</h2></div><button class="icon-button" onclick="closeAuth()" aria-label="Fermer">${icon('close')}</button></div>
          <div class="modal-body">
            <div class="auth-tabs">
              <button class="tab-button ${state.authTab === 'login' ? 'active' : ''}" onclick="setAuthTab('login')">Connexion</button>
              ${registrationEnabled ? `<button class="tab-button ${state.authTab === 'signup' ? 'active' : ''}" onclick="setAuthTab('signup')">Inscription</button>` : ''}
              <button class="tab-button ${state.authTab === 'reset' ? 'active' : ''}" onclick="setAuthTab('reset')">Mot de passe oublié</button>
            </div>
            ${state.authTab === 'signup' && registrationEnabled ? renderSignupForm() : state.authTab === 'reset' ? renderResetForm() : renderLoginForm()}
          </div>
        </div>
      `;
      modal.onclick = event => { if (event.target === modal) closeAuth(); };
    }

    function renderLoginForm() {
      return `
        <form onsubmit="submitLogin(event)">
          <div class="field"><label>Adresse e-mail ou identifiant administrateur</label><input id="login-identifier" class="control" autocomplete="username" placeholder="client@exemple.com" required></div>
          <div class="field" style="margin-top:13px"><label>Mot de passe</label><div class="password-wrap"><input id="login-password" type="password" class="control" autocomplete="current-password" required><button type="button" class="password-toggle" onclick="togglePassword('login-password',this)">${icon('eye')}</button></div></div>
          <div class="notice notice-info" style="margin-top:14px">Les clients utilisent leur adresse e-mail. L’administration utilise uniquement son identifiant autorisé.</div>
          <button id="login-submit" class="button button-primary button-block" style="margin-top:17px" type="submit">${icon('login')} Se connecter</button>
        </form>
      `;
    }

    function renderSignupForm() {
      return `
        <form onsubmit="submitSignup(event)">
          <div class="form-grid">
            <div class="field field-full"><label>Nom complet</label><input id="signup-name" class="control" autocomplete="name" required></div>
            <div class="field field-full"><label>Adresse e-mail</label><input id="signup-email" type="email" class="control" autocomplete="email" required></div>
            <div class="field"><label>Indicatif</label><select id="signup-code" class="control"><option value="+269">Comores +269</option><option value="+262">Mayotte +262</option><option value="+33">France +33</option><option value="+261">Madagascar +261</option></select></div>
            <div class="field"><label>Téléphone</label><input id="signup-phone" type="tel" class="control" autocomplete="tel" required></div>
            <div class="field"><label>Mot de passe</label><div class="password-wrap"><input id="signup-password" type="password" class="control" autocomplete="new-password" required><button type="button" class="password-toggle" onclick="togglePassword('signup-password',this)">${icon('eye')}</button></div></div>
            <div class="field"><label>Confirmer le mot de passe</label><div class="password-wrap"><input id="signup-confirm" type="password" class="control" autocomplete="new-password" required><button type="button" class="password-toggle" onclick="togglePassword('signup-confirm',this)">${icon('eye')}</button></div></div>
          </div>
          <div class="notice" style="margin-top:14px">Le mot de passe doit contenir au moins huit caractères, une lettre et un chiffre.</div>
          <button id="signup-submit" class="button button-primary button-block" style="margin-top:17px" type="submit">${icon('user')} Créer mon compte</button>
        </form>
      `;
    }

    function renderResetForm() {
      return `
        <div class="notice notice-danger" style="margin-bottom:14px">Deux demandes de réinitialisation sont autorisées. Une troisième demande suspend le compte.</div>
        ${!state.resetCodeRequested ? `
          <form onsubmit="requestPasswordReset(event)">
            <div class="field"><label>Adresse e-mail du compte</label><input id="reset-email" type="email" class="control" autocomplete="email" required></div>
            <button id="reset-request-submit" class="button button-primary button-block" style="margin-top:17px" type="submit">Envoyer le code</button>
          </form>
        ` : `
          <form onsubmit="submitPasswordReset(event)">
            <div class="form-grid">
              <div class="field field-full"><label>Adresse e-mail</label><input id="reset-email-final" type="email" class="control" value="${escapeAttribute(state.resetEmail || '')}" required></div>
              <div class="field field-full"><label>Code à six chiffres</label><input id="reset-code" inputmode="numeric" maxlength="6" class="control" required></div>
              <div class="field"><label>Nouveau mot de passe</label><div class="password-wrap"><input id="reset-password" type="password" class="control" required><button type="button" class="password-toggle" onclick="togglePassword('reset-password',this)">${icon('eye')}</button></div></div>
              <div class="field"><label>Confirmer</label><div class="password-wrap"><input id="reset-confirm" type="password" class="control" required><button type="button" class="password-toggle" onclick="togglePassword('reset-confirm',this)">${icon('eye')}</button></div></div>
            </div>
            <button id="reset-final-submit" class="button button-primary button-block" style="margin-top:17px" type="submit">Mettre à jour le mot de passe</button>
          </form>
        `}
      `;
    }

    function togglePassword(inputId, button) {
      const input = document.getElementById(inputId);
      if (!input) return;
      input.type = input.type === 'password' ? 'text' : 'password';
      button.innerHTML = input.type === 'password' ? icon('eye') : icon('eyeOff');
    }

    async function submitLogin(event) {
      event.preventDefault();
      const button = document.getElementById('login-submit');
      setLoading(button, true, 'Connexion');
      try {
        const data = await api('login', {
          identifier: document.getElementById('login-identifier').value.trim(),
          password: document.getElementById('login-password').value
        }, { auth: false });
        state.token = data.token;
        state.user = data.user;
        persistSession();
        closeAuth();
        toast('Connexion réussie');
        if (state.user.role === 'admin') {
          await loadAdminData(true);
          renderAdminShell();
        } else {
          renderClientShell();
        }
      } catch (error) {
        toast(error.message, 'error');
        setLoading(button, false);
      }
    }

    async function submitSignup(event) {
      event.preventDefault();
      const password = document.getElementById('signup-password').value;
      const confirmPassword = document.getElementById('signup-confirm').value;
      if (password !== confirmPassword) {
        toast('Les mots de passe ne correspondent pas', 'error');
        return;
      }
      const button = document.getElementById('signup-submit');
      setLoading(button, true, 'Création');
      try {
        await api('signup', {
          fullName: document.getElementById('signup-name').value.trim(),
          email: document.getElementById('signup-email').value.trim(),
          phone: `${document.getElementById('signup-code').value} ${document.getElementById('signup-phone').value.trim()}`,
          password
        }, { auth: false });
        toast('Compte créé. Vous pouvez vous connecter');
        state.authTab = 'login';
        renderAuthModal();
      } catch (error) {
        toast(error.message, 'error');
        setLoading(button, false);
      }
    }

    async function requestPasswordReset(event) {
      event.preventDefault();
      const button = document.getElementById('reset-request-submit');
      setLoading(button, true, 'Envoi');
      try {
        const email = document.getElementById('reset-email').value.trim();
        const data = await api('request_password_reset', { email }, { auth: false });
        state.resetEmail = email;
        state.resetCodeRequested = true;
        renderAuthModal();
        toast(`Code envoyé. Demandes restantes ${data.remaining}`);
      } catch (error) {
        toast(error.message, 'error');
        setLoading(button, false);
      }
    }

    async function submitPasswordReset(event) {
      event.preventDefault();
      const password = document.getElementById('reset-password').value;
      if (password !== document.getElementById('reset-confirm').value) {
        toast('Les mots de passe ne correspondent pas', 'error');
        return;
      }
      const button = document.getElementById('reset-final-submit');
      setLoading(button, true, 'Mise à jour');
      try {
        await api('reset_password', {
          email: document.getElementById('reset-email-final').value.trim(),
          code: document.getElementById('reset-code').value.trim(),
          newPassword: password
        }, { auth: false });
        state.resetCodeRequested = false;
        state.authTab = 'login';
        renderAuthModal();
        toast('Mot de passe mis à jour');
      } catch (error) {
        toast(error.message, 'error');
        setLoading(button, false);
      }
    }

    function renderChatRoot() {
      const root = document.getElementById('chat-root');
      const settings = state.publicData.settings || {};
      if (state.user?.role === 'admin' || !settings.moduleChat) {
        root.innerHTML = '';
        return;
      }
      root.innerHTML = `
        <button class="chat-launcher" aria-label="Ouvrir le service client" onclick="openChat()">${icon('chat')}</button>
        <section class="chat-panel ${state.chatOpen ? 'open' : ''}">
          <div class="chat-head"><div><h3>Service client</h3><span>Conversation privée avec AB MOTORS</span></div><button class="icon-button" onclick="closeChat()">${icon('close')}</button></div>
          <div id="client-chat-messages" class="chat-messages">${renderChatMessages(state.chatData.messages, 'client')}</div>
          <form class="chat-compose" onsubmit="sendClientChat(event)"><input id="client-chat-input" class="control" maxlength="1200" placeholder="Votre message" autocomplete="off"><button class="icon-button" type="submit" aria-label="Envoyer">${icon('send')}</button></form>
        </section>
      `;
      requestAnimationFrame(scrollClientChat);
    }

    function renderChatMessages(messages, currentRole) {
      if (!messages?.length) return `<div class="empty-state" style="padding:30px 12px"><div class="empty-icon">${icon('chat')}</div><p>Envoyez votre premier message au service client.</p></div>`;
      return messages.map(message => {
        const own = message.senderRole === currentRole;
        return `<div class="message ${own ? 'message-client' : 'message-admin'}">${escapeHTML(message.text)}<time>${escapeHTML(formatDate(message.createdAt, true))}</time></div>`;
      }).join('');
    }

    async function openChat() {
      if (!state.user) {
        openAuth('login');
        toast('Connectez-vous pour contacter le service client', 'error');
        return;
      }
      state.chatOpen = true;
      renderChatRoot();
      await loadClientChat(true);
    }

    function closeChat() {
      state.chatOpen = false;
      renderChatRoot();
    }

    async function loadClientChat(render = false) {
      if (!state.user || !state.publicData.settings?.moduleChat) return;
      try {
        state.chatData = await api('chat_get');
        if (render || state.chatOpen) renderChatRoot();
      } catch (error) {
        if (render) toast(error.message, 'error');
      }
    }

    async function sendClientChat(event) {
      event.preventDefault();
      const input = document.getElementById('client-chat-input');
      const text = input?.value.trim();
      if (!text) return;
      input.value = '';
      try {
        await api('chat_send', { text });
        await loadClientChat(true);
      } catch (error) {
        toast(error.message, 'error');
      }
    }

    function scrollClientChat() {
      const box = document.getElementById('client-chat-messages');
      if (box) box.scrollTop = box.scrollHeight;
    }

    async function loadAdminData(silent = false) {
      if (!state.token || state.user?.role !== 'admin') return;
      try {
        state.adminData = await api('admin_dashboard');
        state.publicData.dates = state.adminData.dates || state.publicData.dates;
        state.publicData.settings = state.adminData.settings || state.publicData.settings;
        if (!silent) renderAdminView();
      } catch (error) {
        if (!silent) toast(error.message, 'error');
      }
    }

    function renderAdminShell() {
      document.body.classList.add('admin-mode');
      document.getElementById('chat-root').innerHTML = '';
      document.getElementById('app').className = 'admin-shell';
      document.getElementById('app').innerHTML = `
        <div class="top-stripe"></div>
        <header class="admin-topbar"><div class="admin-topbar-inner">
          <div class="brand"><div class="brand-mark">AB</div><div class="brand-copy"><strong>AB MOTORS</strong><span>Interface entreprise</span></div></div>
          <div class="admin-status"><i></i><span>Session administrateur active</span><button class="button button-secondary button-small" onclick="logout()">${icon('logout')} Déconnexion</button></div>
        </div></header>
        <div class="admin-layout">
          <aside class="admin-sidebar"><nav class="sidebar-nav">
            ${adminNavButton('dashboard', 'Tableau de bord', 'dashboard')}
            ${adminNavButton('availability', 'Disponibilités', 'calendar')}
            ${adminNavButton('reservations', 'Réservations', 'ticket')}
            ${adminNavButton('prices', 'Tarifs', 'money')}
            ${adminNavButton('features', 'Fonctionnalités', 'controls')}
            ${adminNavButton('clients', 'Clients', 'users')}
            ${adminNavButton('messages', 'Messages', 'chat')}
          </nav></aside>
          <main class="admin-content"><div id="admin-content" class="admin-content-inner"></div></main>
        </div>
      `;
      renderAdminView();
    }

    function adminNavButton(view, label, iconName) {
      return `<button class="sidebar-link ${state.adminView === view ? 'active' : ''}" onclick="setAdminView('${view}')">${icon(iconName)}<span>${label}</span></button>`;
    }

    function setAdminView(view) {
      state.adminView = view;
      renderAdminShell();
      if (view === 'messages' && state.adminChatId) loadAdminChat(state.adminChatId);
    }

    function renderAdminView() {
      const root = document.getElementById('admin-content');
      if (!root) return;
      if (!state.adminData) {
        root.innerHTML = `<div class="admin-panel empty-state"><div class="spinner"></div><p>Chargement des données</p></div>`;
        return;
      }
      if (state.adminView === 'availability') root.innerHTML = renderAdminAvailability();
      else if (state.adminView === 'reservations') root.innerHTML = renderAdminReservations();
      else if (state.adminView === 'prices') root.innerHTML = renderAdminPrices();
      else if (state.adminView === 'features') root.innerHTML = renderAdminFeatures();
      else if (state.adminView === 'clients') root.innerHTML = renderAdminClients();
      else if (state.adminView === 'messages') root.innerHTML = renderAdminMessages();
      else root.innerHTML = renderAdminDashboard();
    }

    function adminPageHead(title, description, action = '') {
      return `<div class="admin-page-head"><div><div class="eyebrow">Espace sécurisé</div><h1>${title}</h1><p>${description}</p></div>${action}</div>`;
    }

    function renderAdminDashboard() {
      const bookings = state.adminData.reservations || [];
      const pending = bookings.filter(b => /attente/i.test(b.status)).length;
      const confirmed = bookings.filter(b => /confirmée/i.test(b.status)).length;
      const revenue = bookings.filter(b => /payée/i.test(b.status)).reduce((sum, b) => sum + Number(b.total || 0), 0);
      return `
        ${adminPageHead('Interface entreprise', 'Gestion globale du service professionnel.', `<button class="button button-secondary" onclick="loadAdminData()">${icon('refresh')} Actualiser</button>`)}
        <div class="stat-grid">
          <div class="stat-card"><span>Réservations</span><strong>${bookings.length}</strong></div>
          <div class="stat-card"><span>En attente</span><strong>${pending}</strong></div>
          <div class="stat-card"><span>Confirmées</span><strong>${confirmed}</strong></div>
          <div class="stat-card"><span>Chiffre payé</span><strong>${formatMoney(revenue)}</strong></div>
        </div>
        <section class="admin-panel"><div class="admin-panel-head"><h2>Réservations récentes</h2><button class="button button-secondary button-small" onclick="setAdminView('reservations')">Voir tout</button></div>${renderAdminBookingsTable(bookings.slice(0, 8))}</section>
      `;
    }

    function renderAdminAvailability() {
      const today = localDateString();
      const dates = Object.entries(state.adminData.dates || {}).filter(([date]) => date >= today).sort(([a], [b]) => a.localeCompare(b)).slice(0, 30);
      return `
        ${adminPageHead('Disponibilités et horaires', 'Ouvrez les créneaux du matin et de l’après-midi, définissez les heures de départ et les capacités.')}
        <section class="admin-panel">
          <div class="admin-panel-head"><h2>Configurer une date</h2></div>
          <div class="form-grid form-grid-3">
            <div class="field"><label>Date</label><input id="admin-date" type="date" min="${today}" value="${today}" class="control" onchange="fillAdminDateForm(this.value)"></div>
            <div class="field"><label>Heure du matin</label><input id="admin-morning-time" type="time" class="control" value="${escapeAttribute(state.adminData.settings.defaultMorningTime || '07:00')}"></div>
            <div class="field"><label>Capacité du matin</label><input id="admin-morning-capacity" type="number" min="1" max="500" class="control" value="${Number(state.adminData.settings.defaultMorningCapacity || 30)}"></div>
            <div class="field"><label>Heure de l’après-midi</label><input id="admin-afternoon-time" type="time" class="control" value="${escapeAttribute(state.adminData.settings.defaultAfternoonTime || '14:00')}"></div>
            <div class="field"><label>Capacité de l’après-midi</label><input id="admin-afternoon-capacity" type="number" min="1" max="500" class="control" value="${Number(state.adminData.settings.defaultAfternoonCapacity || 30)}"></div>
            <div class="field"><label>Créneaux actifs</label><div class="segmented" style="height:50px"><button id="admin-morning-toggle" class="segment active" type="button" onclick="this.classList.toggle('active')">Matin</button><button id="admin-afternoon-toggle" class="segment active" type="button" onclick="this.classList.toggle('active')">Après-midi</button></div></div>
          </div>
          <div class="form-actions" style="justify-content:flex-end"><button class="button button-danger" onclick="removeAdminDate()">${icon('trash')} Fermer la date</button><button id="admin-date-save" class="button button-primary" onclick="saveAdminDate()">${icon('check')} Enregistrer</button></div>
        </section>
        <section class="admin-panel"><div class="admin-panel-head"><h2>Prochains départs ouverts</h2></div>
          ${dates.length ? `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Matin</th><th>Places matin</th><th>Après-midi</th><th>Places après-midi</th><th>Action</th></tr></thead><tbody>${dates.map(([date, d]) => `<tr><td>${escapeHTML(formatDateKey(date))}</td><td>${(d.morningEnabled ?? d.m) ? escapeHTML(d.morningTime) : 'Fermé'}</td><td>${Number(d.morningRemaining || 0)} sur ${Number(d.morningCapacity || 0)}</td><td>${(d.afternoonEnabled ?? d.a) ? escapeHTML(d.afternoonTime) : 'Fermé'}</td><td>${Number(d.afternoonRemaining || 0)} sur ${Number(d.afternoonCapacity || 0)}</td><td><button class="button button-secondary button-small" onclick="selectAdminDate('${date}')">Modifier</button></td></tr>`).join('')}</tbody></table></div>` : `<div class="empty-state"><p>Aucune date ouverte.</p></div>`}
        </section>
      `;
    }

    function selectAdminDate(date) {
      const input = document.getElementById('admin-date');
      if (input) input.value = date;
      fillAdminDateForm(date);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function fillAdminDateForm(date) {
      const d = state.adminData.dates?.[date];
      const s = state.adminData.settings || {};
      document.getElementById('admin-morning-time').value = d?.morningTime || s.defaultMorningTime || '07:00';
      document.getElementById('admin-afternoon-time').value = d?.afternoonTime || s.defaultAfternoonTime || '14:00';
      document.getElementById('admin-morning-capacity').value = d?.morningCapacity || s.defaultMorningCapacity || 30;
      document.getElementById('admin-afternoon-capacity').value = d?.afternoonCapacity || s.defaultAfternoonCapacity || 30;
      document.getElementById('admin-morning-toggle').classList.toggle('active', d ? Boolean(d.morningEnabled ?? d.m) : true);
      document.getElementById('admin-afternoon-toggle').classList.toggle('active', d ? Boolean(d.afternoonEnabled ?? d.a) : true);
    }

    async function saveAdminDate() {
      const button = document.getElementById('admin-date-save');
      setLoading(button, true, 'Enregistrement');
      try {
        await api('admin_update_date', {
          date: document.getElementById('admin-date').value,
          morningEnabled: document.getElementById('admin-morning-toggle').classList.contains('active'),
          afternoonEnabled: document.getElementById('admin-afternoon-toggle').classList.contains('active'),
          morningTime: document.getElementById('admin-morning-time').value,
          afternoonTime: document.getElementById('admin-afternoon-time').value,
          morningCapacity: document.getElementById('admin-morning-capacity').value,
          afternoonCapacity: document.getElementById('admin-afternoon-capacity').value
        });
        toast('Disponibilité enregistrée');
        await loadAdminData(true);
        renderAdminView();
      } catch (error) {
        toast(error.message, 'error');
        setLoading(button, false);
      }
    }

    async function removeAdminDate() {
      const date = document.getElementById('admin-date')?.value;
      if (!date || !confirm('Fermer tous les départs de cette date')) return;
      try {
        await api('admin_update_date', { date, remove: true });
        toast('Date fermée');
        await loadAdminData(true);
        renderAdminView();
      } catch (error) { toast(error.message, 'error'); }
    }

    function renderAdminReservations() {
      return `
        ${adminPageHead('Réservations', 'Validation, paiement, annulation et suppression des demandes.', `<button class="button button-secondary" onclick="loadAdminData()">${icon('refresh')} Actualiser</button>`)}
        <section class="admin-panel"><div class="admin-panel-head"><h2>Toutes les réservations</h2><div class="admin-toolbar"><input id="admin-booking-search" class="control" placeholder="Rechercher un client ou une référence" oninput="filterAdminBookings()"></div></div><div id="admin-bookings-table">${renderAdminBookingsTable(state.adminData.reservations || [])}</div></section>
      `;
    }

    function filterAdminBookings() {
      const query = document.getElementById('admin-booking-search').value.toLowerCase().trim();
      const filtered = (state.adminData.reservations || []).filter(b => [b.id, b.contact, b.email, b.phone, b.details].join(' ').toLowerCase().includes(query));
      document.getElementById('admin-bookings-table').innerHTML = renderAdminBookingsTable(filtered);
    }

    function renderAdminBookingsTable(bookings) {
      if (!bookings.length) return `<div class="empty-state"><p>Aucune réservation.</p></div>`;
      return `<div class="table-wrap"><table><thead><tr><th>Référence</th><th>Client</th><th>Trajet</th><th>Total</th><th>Statut</th><th>Actions</th></tr></thead><tbody>${bookings.map(b => `
        <tr>
          <td><strong>${escapeHTML(b.id)}</strong><small>${escapeHTML(formatDate(b.createdAt, true))}</small></td>
          <td>${escapeHTML(b.contact)}<small>${escapeHTML(b.email)}<br>${escapeHTML(b.phone)}</small></td>
          <td>${escapeHTML(b.details)}<small>${escapeHTML(b.pax)} | ${Number(b.baggageCount || 0)} bagages</small></td>
          <td><strong>${formatMoney(b.total)}</strong><small>${escapeHTML(b.paymentStatus || '')}</small></td>
          <td><span class="badge ${bookingBadge(b.status)}">${escapeHTML(b.status)}</span></td>
          <td><div class="table-actions">
            <button class="button button-primary button-small" onclick="adminSetBooking('${escapeAttribute(b.id)}','Confirmée et payée')">Payée</button>
            <button class="button button-warning button-small" onclick="adminSetBooking('${escapeAttribute(b.id)}','Confirmée et non payée')">Non payée</button>
            <button class="button button-danger button-small" onclick="adminSetBooking('${escapeAttribute(b.id)}','Annulée par l’administration')">Annuler</button>
            <button class="icon-button" title="Supprimer" onclick="adminDeleteBooking('${escapeAttribute(b.id)}')">${icon('trash')}</button>
          </div></td>
        </tr>
      `).join('')}</tbody></table></div>`;
    }

    async function adminSetBooking(id, status) {
      const booking = state.adminData.reservations.find(item => item.id === id);
      if (!booking) return;
      try {
        let pdfBase64 = '';
        if (/Confirmée/.test(status)) pdfBase64 = await generateReceiptPdf(booking, status);
        await api('admin_update_booking', { bookingId: id, status, pdfBase64 });
        toast('Statut de la réservation mis à jour');
        await loadAdminData(true);
        renderAdminView();
      } catch (error) { toast(error.message, 'error'); }
    }

    async function generateReceiptPdf(booking, status) {
      if (!window.jspdf?.jsPDF) return '';
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: 'mm', format: 'a4' });
      pdf.setFillColor(10, 27, 47);
      pdf.rect(0, 0, 210, 36, 'F');
      pdf.setTextColor(255, 255, 255);
      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(20);
      pdf.text('AB MOTORS', 16, 17);
      pdf.setFontSize(10);
      pdf.setFont('helvetica', 'normal');
      pdf.text('Reçu de réservation maritime', 16, 25);
      pdf.setTextColor(20, 34, 55);
      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(14);
      pdf.text('Réservation ' + booking.id, 16, 51);
      const rows = [
        ['Client', booking.contact],
        ['E-mail', booking.email],
        ['Téléphone', booking.phone],
        ['Trajet', booking.details],
        ['Passagers', booking.pax],
        ['Bagages', String(booking.baggageCount || 0)],
        ['Statut', status],
        ['Total', formatMoney(booking.total)]
      ];
      let y = 65;
      rows.forEach(([label, value]) => {
        pdf.setFont('helvetica', 'bold');
        pdf.setFontSize(10);
        pdf.text(label, 16, y);
        pdf.setFont('helvetica', 'normal');
        const lines = pdf.splitTextToSize(String(value || ''), 130);
        pdf.text(lines, 58, y);
        y += Math.max(9, lines.length * 5 + 4);
      });
      pdf.setDrawColor(50, 196, 147);
      pdf.setLineWidth(1);
      pdf.line(16, y + 4, 194, y + 4);
      pdf.setFont('helvetica', 'normal');
      pdf.setFontSize(9);
      pdf.setTextColor(90, 105, 125);
      pdf.text('Document généré automatiquement par AB MOTORS', 16, y + 15);
      return pdf.output('datauristring').split(',')[1];
    }

    async function adminDeleteBooking(id) {
      if (!confirm('Supprimer définitivement cette réservation')) return;
      try {
        await api('admin_delete_booking', { bookingId: id });
        toast('Réservation supprimée');
        await loadAdminData(true);
        renderAdminView();
      } catch (error) { toast(error.message, 'error'); }
    }

    function renderAdminPrices() {
      const s = state.adminData.settings || {};
      return `
        ${adminPageHead('Tarifs', 'Modifiez tous les prix utilisés par le calcul automatique.')}
        <section class="admin-panel"><div class="admin-panel-head"><h2>Grille tarifaire</h2></div>
          <div class="form-grid form-grid-3">
            ${numberField('priceAdult', 'Tarif adulte', s.priceAdult, '€')}
            ${numberField('priceChild', 'Tarif enfant', s.priceChild, '€')}
            ${numberField('priceBaggage', 'Tarif bagage', s.priceBaggage, '€')}
            ${numberField('cancellationPenalty', 'Pénalité d’annulation', s.cancellationPenalty, '€')}
            ${numberField('cancellationLimitHours', 'Délai sans pénalité', s.cancellationLimitHours, 'heures')}
            ${numberField('autoRefreshSeconds', 'Actualisation automatique', s.autoRefreshSeconds, 'secondes')}
          </div>
          <div class="form-actions" style="justify-content:flex-end"><button id="admin-prices-save" class="button button-primary" onclick="saveAdminPrices()">${icon('check')} Enregistrer les tarifs</button></div>
        </section>
      `;
    }

    function numberField(id, label, value, suffix) {
      return `<div class="field"><label>${label}</label><input id="${id}" class="control" type="number" min="0" step="0.01" value="${Number(value || 0)}"><small>${suffix}</small></div>`;
    }

    async function saveAdminPrices() {
      const button = document.getElementById('admin-prices-save');
      setLoading(button, true, 'Enregistrement');
      try {
        await api('admin_update_settings', { settings: {
          priceAdult: document.getElementById('priceAdult').value,
          priceChild: document.getElementById('priceChild').value,
          priceBaggage: document.getElementById('priceBaggage').value,
          cancellationPenalty: document.getElementById('cancellationPenalty').value,
          cancellationLimitHours: document.getElementById('cancellationLimitHours').value,
          autoRefreshSeconds: document.getElementById('autoRefreshSeconds').value
        }});
        toast('Tarifs enregistrés');
        await loadAdminData(true);
        scheduleAutoRefresh();
        renderAdminView();
      } catch (error) { toast(error.message, 'error'); setLoading(button, false); }
    }

    function renderAdminFeatures() {
      const s = state.adminData.settings || {};
      const items = [
        ['moduleReservation', 'Réservation client', 'Autorise la recherche de disponibilité et la création de réservation'],
        ['moduleManage', 'Gestion des réservations', 'Autorise les clients à consulter et annuler leurs réservations'],
        ['moduleHelp', 'Page d’aide', 'Affiche les informations et les règles du service'],
        ['moduleChat', 'Messagerie client', 'Active le chat entre les clients et l’administration'],
        ['moduleRegistration', 'Création de compte', 'Autorise les nouvelles inscriptions'],
        ['moduleBaggage', 'Option bagages', 'Affiche et facture les bagages dans le parcours client']
      ];
      return `
        ${adminPageHead('Fonctionnalités', 'Activez ou désactivez les modules visibles et utilisables côté client.')}
        <section class="admin-panel"><div class="switch-list">${items.map(([key, title, description]) => `
          <div class="switch-row"><div class="switch-copy"><strong>${title}</strong><span>${description}</span></div><label class="toggle"><input id="${key}" type="checkbox" ${s[key] ? 'checked' : ''}><span class="toggle-slider"></span></label></div>
        `).join('')}</div><div class="form-actions" style="justify-content:flex-end"><button id="admin-features-save" class="button button-primary" onclick="saveAdminFeatures()">${icon('check')} Enregistrer</button></div></section>
      `;
    }

    async function saveAdminFeatures() {
      const button = document.getElementById('admin-features-save');
      setLoading(button, true, 'Enregistrement');
      try {
        const keys = ['moduleReservation', 'moduleManage', 'moduleHelp', 'moduleChat', 'moduleRegistration', 'moduleBaggage'];
        const settings = Object.fromEntries(keys.map(key => [key, document.getElementById(key).checked]));
        await api('admin_update_settings', { settings });
        toast('Fonctionnalités mises à jour');
        await loadAdminData(true);
        renderAdminView();
      } catch (error) { toast(error.message, 'error'); setLoading(button, false); }
    }

    function renderAdminClients() {
      const users = state.adminData.users || [];
      return `
        ${adminPageHead('Clients', 'Gestion des comptes, des suspensions et des limites de sécurité.')}
        <section class="admin-panel"><div class="admin-panel-head"><h2>${users.length} comptes clients</h2><div class="admin-toolbar"><input id="admin-user-search" class="control" placeholder="Rechercher un client" oninput="filterAdminUsers()"></div></div><div id="admin-users-table">${renderAdminUsersTable(users)}</div></section>
      `;
    }

    function filterAdminUsers() {
      const query = document.getElementById('admin-user-search').value.toLowerCase().trim();
      const users = (state.adminData.users || []).filter(u => [u.fullName, u.email, u.phone].join(' ').toLowerCase().includes(query));
      document.getElementById('admin-users-table').innerHTML = renderAdminUsersTable(users);
    }

    function renderAdminUsersTable(users) {
      if (!users.length) return `<div class="empty-state"><p>Aucun client.</p></div>`;
      return `<div class="table-wrap"><table><thead><tr><th>Client</th><th>Contact</th><th>Création</th><th>Réinitialisations</th><th>État</th><th>Actions</th></tr></thead><tbody>${users.map(u => `
        <tr><td><strong>${escapeHTML(u.fullName)}</strong><small>${escapeHTML(u.userId)}</small></td><td>${escapeHTML(u.email)}<small>${escapeHTML(u.phone)}</small></td><td>${escapeHTML(formatDate(u.createdAt))}<small>Dernière connexion ${escapeHTML(formatDate(u.lastLoginAt, true))}</small></td><td>${Number(u.resetCount || 0)} sur 2</td><td><span class="badge ${u.banned ? 'badge-danger' : 'badge-success'}">${u.banned ? 'Suspendu' : 'Actif'}</span>${u.banReason ? `<small>${escapeHTML(u.banReason)}</small>` : ''}</td><td><div class="table-actions"><button class="button ${u.banned ? 'button-primary' : 'button-danger'} button-small" onclick="toggleAdminUserBan('${escapeAttribute(u.userId)}',${!u.banned})">${u.banned ? 'Réactiver' : 'Suspendre'}</button><button class="button button-secondary button-small" onclick="resetAdminUserSecurity('${escapeAttribute(u.userId)}')">Réinitialiser la sécurité</button></div></td></tr>
      `).join('')}</tbody></table></div>`;
    }

    async function toggleAdminUserBan(userId, banned) {
      let reason = '';
      if (banned) {
        reason = prompt('Motif de la suspension', 'Compte suspendu par l’administration') || '';
        if (!reason) return;
      }
      try {
        await api('admin_toggle_user_ban', { userId, banned, reason });
        toast(banned ? 'Compte suspendu' : 'Compte réactivé');
        await loadAdminData(true);
        renderAdminView();
      } catch (error) { toast(error.message, 'error'); }
    }

    async function resetAdminUserSecurity(userId) {
      if (!confirm('Réinitialiser les compteurs de sécurité et réactiver ce compte')) return;
      try {
        await api('admin_reset_user_security', { userId });
        toast('Sécurité du compte réinitialisée');
        await loadAdminData(true);
        renderAdminView();
      } catch (error) { toast(error.message, 'error'); }
    }

    function renderAdminMessages() {
      const chats = state.adminData.chats || [];
      const selected = chats.find(chat => chat.chatId === state.adminChatId);
      return `
        ${adminPageHead('Messages', 'Conversations en cours avec les clients.')}
        <section class="admin-chat-grid">
          <div class="chat-list">${chats.length ? chats.map(chat => `<button class="chat-list-item ${state.adminChatId === chat.chatId ? 'active' : ''}" onclick="selectAdminChat('${escapeAttribute(chat.chatId)}')"><strong>${escapeHTML(chat.clientName)}</strong><span>${escapeHTML(chat.clientEmail)}</span><span>Mis à jour ${escapeHTML(formatDate(chat.updatedAt, true))}</span></button>`).join('') : `<div class="empty-state"><p>Aucune conversation ouverte.</p></div>`}</div>
          <div class="admin-chat-box">
            ${selected ? `
              <div class="chat-head"><div><h3>${escapeHTML(selected.clientName)}</h3><span>${escapeHTML(selected.clientEmail)}</span></div><button class="button button-danger button-small" onclick="closeAdminChat('${escapeAttribute(selected.chatId)}')">Clôturer</button></div>
              <div id="admin-chat-messages" class="chat-messages">${renderChatMessages(state.chatData.messages, 'admin')}</div>
              <form class="chat-compose" onsubmit="sendAdminChat(event)"><input id="admin-chat-input" class="control" maxlength="1200" placeholder="Votre réponse" autocomplete="off"><button class="icon-button" type="submit">${icon('send')}</button></form>
            ` : `<div class="empty-state"><div class="empty-icon">${icon('chat')}</div><h2>Sélectionnez une conversation</h2></div>`}
          </div>
        </section>
      `;
    }

    async function selectAdminChat(chatId) {
      state.adminChatId = chatId;
      await loadAdminChat(chatId);
    }

    async function loadAdminChat(chatId, silent = false) {
      try {
        state.chatData = await api('chat_get', { chatId });
        if (!silent) renderAdminView();
        requestAnimationFrame(() => {
          const box = document.getElementById('admin-chat-messages');
          if (box) box.scrollTop = box.scrollHeight;
        });
      } catch (error) { if (!silent) toast(error.message, 'error'); }
    }

    async function sendAdminChat(event) {
      event.preventDefault();
      const input = document.getElementById('admin-chat-input');
      const text = input?.value.trim();
      if (!text || !state.adminChatId) return;
      input.value = '';
      try {
        await api('chat_send', { chatId: state.adminChatId, text });
        await loadAdminChat(state.adminChatId);
      } catch (error) { toast(error.message, 'error'); }
    }

    async function closeAdminChat(chatId) {
      if (!confirm('Clôturer cette conversation et supprimer son historique côté client')) return;
      try {
        await api('chat_close', { chatId });
        state.adminChatId = '';
        state.chatData = { chat: null, messages: [] };
        toast('Conversation clôturée');
        await loadAdminData(true);
        renderAdminView();
      } catch (error) { toast(error.message, 'error'); }
    }

    async function loadPublicDataSilently() {
      try {
        state.publicData = await api('public_data', {}, { auth: false, keepSession: true });
      } catch (error) {}
    }

    function scheduleAutoRefresh() {
      if (state.autoRefreshTimer) clearInterval(state.autoRefreshTimer);
      const seconds = Math.max(15, Number(state.publicData.settings?.autoRefreshSeconds || 20));
      state.autoRefreshTimer = setInterval(silentRefresh, seconds * 1000);
    }

    async function silentRefresh() {
      if (document.hidden) return;
      await loadPublicDataSilently();
      if (state.user?.role === 'admin') {
        try {
          state.adminData = await api('admin_dashboard');
          if (state.adminView === 'messages' && state.adminChatId) await loadAdminChat(state.adminChatId, true);
          const activeTag = document.activeElement?.tagName;
          if (!['INPUT', 'SELECT', 'TEXTAREA'].includes(activeTag) && ['dashboard', 'reservations', 'clients', 'messages'].includes(state.adminView)) renderAdminView();
        } catch (error) {}
      } else if (state.user) {
        if (state.clientView === 'manage') {
          try {
            const data = await api('get_my_bookings');
            state.bookings = data.bookings || [];
            renderClientView();
          } catch (error) {}
        }
        if (state.chatOpen) await loadClientChat(true);
      }
    }

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        closeAuth();
        if (state.chatOpen) closeChat();
      }
    });

    bootstrap();
  </script>
</body>
</html>
