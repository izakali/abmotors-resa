<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07162b">
  <title>AB MOTORS — Réservation maritime</title>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root{
      --navy-950:#061221;
      --navy-900:#0a1a2f;
      --navy-850:#0e213a;
      --navy-800:#122844;
      --navy-700:#1b3556;
      --line:rgba(160,190,225,.18);
      --line-strong:rgba(160,190,225,.32);
      --text:#f3f7fd;
      --muted:#aab9cd;
      --muted-2:#7f91aa;
      --green:#35c79a;
      --green-dark:#1e9f79;
      --blue:#66b9eb;
      --amber:#f0b94f;
      --red:#ef6672;
      --surface:rgba(14,33,58,.94);
      --surface-soft:rgba(18,40,68,.78);
      --shadow:0 28px 80px rgba(0,0,0,.34);
      --radius:22px;
      --radius-sm:14px;
      --font:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      background:var(--navy-950);
      font-family:var(--font);
      overflow-x:hidden;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:-3;
      background:
        linear-gradient(90deg,rgba(4,14,27,.94) 0%,rgba(5,18,34,.76) 50%,rgba(5,19,32,.80) 100%),
        url("bateau.PNG") center/cover no-repeat;
    }
    body::after{
      content:"";
      position:fixed;
      inset:0;
      z-index:-2;
      pointer-events:none;
      background:
        radial-gradient(circle at 12% 18%,rgba(56,144,189,.22),transparent 30%),
        radial-gradient(circle at 88% 56%,rgba(47,197,153,.13),transparent 30%);
    }

    button,input,select,textarea{font:inherit}
    button{color:inherit}
    a{color:inherit}
    .hidden{display:none!important}
    .icon{width:20px;height:20px;display:inline-block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
    .icon-sm{width:17px;height:17px}
    .icon-lg{width:28px;height:28px}
    .app-width{width:min(1240px,calc(100% - 36px));margin-inline:auto}
    .client-shell{min-height:100vh}
    .site-header{
      position:sticky;
      top:0;
      z-index:80;
      border-bottom:1px solid var(--line);
      background:rgba(7,22,43,.90);
      backdrop-filter:blur(18px);
    }
    .site-header::before{
      content:"";
      position:absolute;
      inset:0 0 auto;
      height:3px;
      background:linear-gradient(90deg,#2ebf8e 0 25%,#f1bd4d 25% 50%,#e95162 50% 75%,#4c91e8 75%);
    }
    .nav-wrap{
      min-height:76px;
      display:flex;
      align-items:center;
      gap:28px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      text-decoration:none;
      min-width:max-content;
    }
    .brand-mark{
      width:42px;
      height:42px;
      border-radius:13px;
      display:grid;
      place-items:center;
      border:1px solid rgba(240,185,79,.5);
      background:linear-gradient(145deg,#c8942d,#f0c969);
      color:#07162b;
      font-weight:900;
      letter-spacing:-1px;
      box-shadow:inset 0 1px rgba(255,255,255,.5);
    }
    .brand-copy strong{display:block;font-size:16px;letter-spacing:.01em}
    .brand-copy small{display:block;margin-top:3px;color:var(--muted-2);font-size:12px}
    .nav-links{display:flex;align-items:center;justify-content:center;gap:8px;flex:1}
    .nav-link{
      border:0;
      background:transparent;
      color:var(--muted);
      padding:12px 14px;
      border-radius:11px;
      font-weight:750;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      transition:.2s ease;
    }
    .nav-link:hover,.nav-link.active{color:var(--green);background:rgba(53,199,154,.08)}
    .nav-actions{display:flex;align-items:center;gap:10px}
    .mobile-menu{display:none}
    .button{
      border:1px solid transparent;
      border-radius:12px;
      min-height:46px;
      padding:0 18px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      font-weight:800;
      cursor:pointer;
      transition:transform .18s ease,border-color .18s ease,background .18s ease,opacity .18s ease;
      text-decoration:none;
    }
    .button:hover{transform:translateY(-1px)}
    .button:disabled{opacity:.48;cursor:not-allowed;transform:none}
    .button-primary{background:var(--green);color:#041a14}
    .button-primary:hover{background:#45d4a7}
    .button-secondary{background:var(--navy-800);border-color:var(--line-strong);color:var(--text)}
    .button-secondary:hover{border-color:rgba(53,199,154,.55)}
    .button-danger{background:rgba(239,102,114,.12);border-color:rgba(239,102,114,.42);color:#ff9aa3}
    .button-warning{background:rgba(240,185,79,.12);border-color:rgba(240,185,79,.4);color:#ffd37b}
    .button-small{min-height:38px;padding:0 13px;border-radius:10px;font-size:13px}
    .button-icon{width:42px;padding:0}
    .main{padding:54px 0 90px}
    .page-grid{display:grid;grid-template-columns:minmax(0,1.16fr) minmax(380px,.84fr);gap:34px;align-items:center}
    .eyebrow{
      color:var(--green);
      letter-spacing:.18em;
      text-transform:uppercase;
      font-weight:900;
      font-size:13px;
    }
    .hero-title{
      margin:18px 0 20px;
      font-size:clamp(42px,6vw,76px);
      line-height:.98;
      letter-spacing:-.055em;
      max-width:820px;
    }
    .hero-title span{color:#a9d3f2}
    .hero-text{max-width:690px;color:#c3cfdf;font-size:18px;line-height:1.72}
    .hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
    .trust-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:32px;max-width:650px}
    .trust-card{
      min-height:92px;
      border:1px solid var(--line);
      background:rgba(16,36,62,.72);
      border-radius:15px;
      padding:16px;
    }
    .trust-card strong{display:block;font-size:16px}
    .trust-card span{display:block;color:var(--muted-2);font-size:13px;margin-top:7px}
    .panel{
      border:1px solid var(--line-strong);
      background:var(--surface);
      box-shadow:var(--shadow);
      border-radius:var(--radius);
      overflow:hidden;
    }
    .panel-inner{padding:25px}
    .availability-panel{position:relative}
    .availability-panel::after{
      content:"";
      position:absolute;
      inset:auto 0 0;
      height:3px;
      background:linear-gradient(90deg,var(--green),var(--blue));
    }
    .panel-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:18px;
      margin-bottom:20px;
    }
    .panel-title{margin:0;font-size:23px;letter-spacing:-.025em}
    .panel-subtitle{color:var(--muted);line-height:1.55;margin:7px 0 0}
    .status-pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      min-height:34px;
      padding:0 12px;
      border:1px solid rgba(53,199,154,.34);
      background:rgba(53,199,154,.08);
      color:#76e0bc;
      border-radius:999px;
      font-size:12px;
      font-weight:850;
      white-space:nowrap;
    }
    .status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px rgba(53,199,154,.08)}
    .departure-list{display:grid;gap:10px}
    .departure-row{
      border:1px solid var(--line);
      background:rgba(7,22,43,.5);
      border-radius:14px;
      padding:14px;
      display:grid;
      grid-template-columns:auto 1fr auto;
      gap:12px;
      align-items:center;
    }
    .departure-date{
      width:52px;height:52px;border-radius:12px;background:var(--navy-800);
      display:grid;place-items:center;text-align:center;border:1px solid var(--line)
    }
    .departure-date strong{font-size:17px;line-height:1}
    .departure-date span{font-size:10px;color:var(--muted-2);text-transform:uppercase;margin-top:2px}
    .departure-copy strong{display:block}
    .departure-copy span{display:block;color:var(--muted-2);font-size:13px;margin-top:4px}
    .departure-seats{font-size:12px;color:#8ee7c8;font-weight:800}
    .section-shell{display:grid;gap:22px}
    .section-header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
    .section-header h1{margin:8px 0 0;font-size:clamp(32px,4vw,48px);letter-spacing:-.04em}
    .section-header p{margin:8px 0 0;color:var(--muted);line-height:1.55}
    .content-card{
      border:1px solid var(--line-strong);
      background:rgba(10,26,47,.96);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }
    .content-card-body{padding:26px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
    .field{display:grid;gap:8px}
    .field.full{grid-column:1/-1}
    .field label{font-size:13px;font-weight:800;color:#dce7f5}
    .input,.select,.textarea{
      width:100%;
      min-height:50px;
      border:1px solid var(--line-strong);
      background:#0b1d34;
      color:var(--text);
      border-radius:12px;
      padding:0 14px;
      outline:none;
      transition:border-color .18s ease,box-shadow .18s ease;
    }
    .textarea{min-height:110px;padding:14px;resize:vertical}
    .input::placeholder,.textarea::placeholder{color:#6f819a}
    .input:focus,.select:focus,.textarea:focus{border-color:rgba(53,199,154,.7);box-shadow:0 0 0 4px rgba(53,199,154,.08)}
    .input-wrap{position:relative}
    .input-wrap .input{padding-left:45px;padding-right:46px}
    .input-leading{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#9babc0;pointer-events:none}
    .input-action{position:absolute;right:7px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#91a1b7;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;border-radius:9px}
    .input-action:hover{background:rgba(255,255,255,.06);color:var(--text)}
    .stepper{display:flex;gap:8px;align-items:center;margin-bottom:20px}
    .step{
      flex:1;height:5px;border-radius:999px;background:var(--navy-700);overflow:hidden
    }
    .step.active{background:linear-gradient(90deg,var(--green),var(--blue))}
    .route-line{
      display:grid;
      grid-template-columns:1fr auto 1fr;
      gap:12px;
      align-items:end;
    }
    .swap-button{margin-bottom:0}
    .calendar-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 12px}
    .calendar-wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .month{
      border:1px solid var(--line);
      background:rgba(7,22,43,.55);
      border-radius:16px;
      padding:14px;
    }
    .month-title{text-align:center;font-weight:900;margin:2px 0 13px;text-transform:capitalize}
    .weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
    .weekday{text-align:center;color:var(--muted-2);font-size:11px;font-weight:800;padding:5px 0}
    .day{
      aspect-ratio:1;
      min-width:0;
      border:1px solid transparent;
      border-radius:9px;
      background:transparent;
      color:#5e718d;
      display:grid;
      place-items:center;
      cursor:not-allowed;
      position:relative;
      font-size:12px;
    }
    .day.available{
      color:#dce9f7;
      cursor:pointer;
      background:rgba(21,48,79,.66);
      border-color:var(--line);
    }
    .day.available:hover{border-color:rgba(53,199,154,.65)}
    .day.selected{background:var(--green);color:#051a14;font-weight:900}
    .day-dots{position:absolute;bottom:4px;display:flex;gap:3px}
    .day-dot{width:4px;height:4px;border-radius:50%;background:var(--amber)}
    .day-dot.afternoon{background:var(--blue)}
    .slot-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
    .slot-button{
      border:1px solid var(--line-strong);
      background:#0b1d34;
      color:var(--text);
      min-height:78px;
      border-radius:14px;
      padding:12px;
      cursor:pointer;
      display:grid;
      gap:5px;
      text-align:left;
    }
    .slot-button:hover{border-color:rgba(53,199,154,.65)}
    .slot-button.selected{background:rgba(53,199,154,.12);border-color:var(--green)}
    .slot-button:disabled{opacity:.35;cursor:not-allowed}
    .slot-button strong{display:flex;align-items:center;gap:8px}
    .slot-button span{color:var(--muted-2);font-size:12px}
    .counters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .counter-card{border:1px solid var(--line);background:#0b1d34;border-radius:14px;padding:14px}
    .counter-card label{display:block;font-size:13px;font-weight:850}
    .counter-card small{color:var(--muted-2)}
    .counter-controls{display:flex;align-items:center;justify-content:space-between;margin-top:13px}
    .counter-button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line-strong);background:var(--navy-800);cursor:pointer;font-size:20px}
    .counter-value{font-size:20px;font-weight:900}
    .passenger-list{display:grid;gap:12px;margin-top:18px}
    .passenger-card{border:1px solid var(--line);background:rgba(7,22,43,.5);border-radius:15px;padding:16px}
    .passenger-card h3{font-size:15px;margin:0 0 14px}
    .summary{
      display:grid;
      gap:10px;
      border:1px solid var(--line);
      border-radius:16px;
      background:#0b1d34;
      padding:18px;
    }
    .summary-row{display:flex;justify-content:space-between;gap:18px;color:#ced9e7}
    .summary-row span:last-child{text-align:right;font-weight:800;color:var(--text)}
    .summary-total{border-top:1px solid var(--line);padding-top:14px;margin-top:4px;font-size:20px}
    .form-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:22px}
    .notice{
      display:flex;gap:12px;align-items:flex-start;
      border:1px solid rgba(102,185,235,.3);
      background:rgba(102,185,235,.08);
      color:#cfe7fa;
      border-radius:13px;
      padding:14px;
      line-height:1.5;
    }
    .notice.warning{border-color:rgba(240,185,79,.34);background:rgba(240,185,79,.08);color:#ffe0a1}
    .notice.danger{border-color:rgba(239,102,114,.38);background:rgba(239,102,114,.08);color:#ffb2b8}
    .gate{
      text-align:center;
      padding:52px 24px;
      border:1px dashed var(--line-strong);
      border-radius:18px;
      background:rgba(7,22,43,.42);
    }
    .gate-icon{width:64px;height:64px;border-radius:18px;background:rgba(53,199,154,.1);color:var(--green);display:grid;place-items:center;margin:0 auto 18px}
    .gate h2{margin:0 0 9px}
    .gate p{margin:0 auto 22px;color:var(--muted);max-width:520px;line-height:1.6}
    .booking-list{display:grid;gap:14px}
    .booking-card{border:1px solid var(--line);background:#0b1d34;border-radius:17px;padding:18px}
    .booking-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
    .booking-ref{font-size:12px;color:var(--muted-2);letter-spacing:.08em;text-transform:uppercase}
    .booking-head h3{margin:5px 0 0;font-size:19px}
    .badge{
      display:inline-flex;align-items:center;min-height:31px;padding:0 10px;border-radius:999px;
      font-size:11px;font-weight:900;border:1px solid var(--line-strong);background:var(--navy-800)
    }
    .badge.good{color:#84e9c5;border-color:rgba(53,199,154,.4);background:rgba(53,199,154,.08)}
    .badge.warn{color:#ffd27c;border-color:rgba(240,185,79,.4);background:rgba(240,185,79,.08)}
    .badge.bad{color:#ffa1aa;border-color:rgba(239,102,114,.4);background:rgba(239,102,114,.08)}
    .booking-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
    .meta-box{border:1px solid var(--line);border-radius:12px;padding:12px}
    .meta-box span{display:block;color:var(--muted-2);font-size:11px}
    .meta-box strong{display:block;margin-top:5px;font-size:13px}
    .booking-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
    .faq-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .faq-card{border:1px solid var(--line);background:#0b1d34;border-radius:16px;padding:18px}
    .faq-card h3{margin:0 0 8px;font-size:16px}
    .faq-card p{margin:0;color:var(--muted);line-height:1.6;font-size:14px}
    .chat-box{display:grid;grid-template-rows:auto minmax(260px,420px) auto}
    .chat-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
    .chat-messages{padding:18px;overflow:auto;display:grid;align-content:start;gap:10px;background:rgba(6,18,33,.4)}
    .chat-empty{color:var(--muted);text-align:center;padding:60px 20px}
    .message{max-width:min(78%,560px);padding:11px 13px;border-radius:14px;background:var(--navy-800);border:1px solid var(--line);line-height:1.45}
    .message.client{justify-self:end;background:rgba(53,199,154,.12);border-color:rgba(53,199,154,.3)}
    .message.admin{justify-self:start}
    .message small{display:block;color:var(--muted-2);font-size:10px;margin-top:6px}
    .chat-compose{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px;border-top:1px solid var(--line)}
    .modal-backdrop{
      position:fixed;inset:0;z-index:120;background:rgba(2,8,16,.78);backdrop-filter:blur(10px);
      display:grid;place-items:center;padding:20px
    }
    .modal{
      width:min(620px,100%);
      max-height:calc(100vh - 40px);
      overflow:auto;
      border:1px solid var(--line-strong);
      background:var(--navy-850);
      border-radius:24px;
      box-shadow:var(--shadow);
    }
    .modal-head{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 24px;border-bottom:1px solid var(--line)}
    .modal-head h2{margin:0;font-size:28px}
    .modal-head p{margin:7px 0 0;color:var(--muted)}
    .modal-body{padding:24px}
    .auth-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
    .auth-tab{border:1px solid var(--line);background:#0b1d34;min-height:42px;border-radius:10px;cursor:pointer;font-weight:800;font-size:13px}
    .auth-tab.active{border-color:var(--green);color:var(--green);background:rgba(53,199,154,.08)}
    .toast-stack{position:fixed;right:20px;bottom:20px;z-index:160;display:grid;gap:10px;width:min(390px,calc(100% - 40px))}
    .toast{border:1px solid var(--line-strong);background:rgba(10,26,47,.98);box-shadow:var(--shadow);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
    .toast.success{border-color:rgba(53,199,154,.42)}
    .toast.error{border-color:rgba(239,102,114,.48)}
    .toast strong{display:block}
    .toast span{display:block;color:var(--muted);font-size:13px;margin-top:3px;line-height:1.4}
    .spinner{width:19px;height:19px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:currentColor;animation:spin .75s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Administration */
    .admin-shell{min-height:100vh;background:rgba(5,16,30,.94)}
    .admin-topbar{
      min-height:72px;border-bottom:1px solid var(--line);background:#0b1d34;
      display:flex;align-items:center;position:sticky;top:0;z-index:90
    }
    .admin-topbar-inner{display:flex;align-items:center;gap:20px}
    .admin-title{font-weight:900}
    .admin-title small{display:block;color:var(--muted-2);font-size:11px;margin-top:3px}
    .admin-nav{display:flex;gap:5px;flex:1;justify-content:center;overflow:auto}
    .admin-nav button{
      min-height:42px;border:0;background:transparent;color:var(--muted);padding:0 13px;border-radius:9px;font-weight:800;cursor:pointer;white-space:nowrap
    }
    .admin-nav button.active,.admin-nav button:hover{background:rgba(53,199,154,.09);color:var(--green)}
    .admin-main{padding:30px 0 70px}
    .admin-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px}
    .admin-hero h1{margin:8px 0 0;font-size:42px;letter-spacing:-.04em}
    .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .stat-card{border:1px solid var(--line);background:var(--surface-soft);border-radius:16px;padding:18px}
    .stat-card span{display:block;color:var(--muted);font-size:12px}
    .stat-card strong{display:block;font-size:30px;margin-top:8px}

    .switch-copy span{display:block;color:var(--muted-2);font-size:12px;margin-top:4px}
    .switch{position:relative;width:48px;height:27px;flex:0 0 auto}
    .switch input{opacity:0;width:0;height:0}
    .switch-slider{position:absolute;inset:0;border-radius:999px;background:#29405e;cursor:pointer;transition:.2s}
    .switch-slider::before{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;border-radius:50%;background:#d9e4f1;transition:.2s}

    function structuredCloneSafe(value){
      return JSON.parse(JSON.stringify(value));

    function icon(name, className=""){

      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      })[char]);
    }

    function readStorage(key, sessionOnly=false){
      try{
        const storage = sessionOnly ? sessionStorage : localStorage;
        return JSON.parse(storage.getItem(key) || "null");
      }catch(error){
        return null;
      }
    }

    function writeStorage(key, value, sessionOnly=false){
      const storage = sessionOnly ? sessionStorage : localStorage;
      if(value) storage.setItem(key, JSON.stringify(value));
      else storage.removeItem(key);

    function mergeDeep(base, incoming){
      const output = structuredCloneSafe(base);
      Object.keys(incoming || {}).forEach(key => {
        if(incoming[key] && typeof incoming[key] === "object" && !Array.isArray(incoming[key]) && output[key] && typeof output[key] === "object"){
          output[key] = mergeDeep(output[key], incoming[key]);
        }else{
          output[key] = incoming[key];
        }
      });
      return output;
    }

      let timer;
      return (...args) => {

    async function api(action, payload={}, method="POST"){
      const options = {
        method,
        redirect:"follow",
        cache:"no-store"
      };
      let url = GOOGLE_WEB_APP_URL;
      if(method === "GET"){
        const query = new URLSearchParams({action,...payload,_:Date.now().toString()});
        url += `${url.includes("?") ? "&" : "?"}${query.toString()}`;
      }else{
        options.body = JSON.stringify({action,...payload});
      }

      let response;
      try{
        response = await fetch(url, options);
      }catch(error){
        throw new Error("Connexion au serveur impossible");
      }

      const text = await response.text();
      let data;
      try{
        data = JSON.parse(text);
      }catch(error){
        throw new Error("Réponse serveur invalide");
      }

      if(!data.ok){
        const err = new Error(data.error || "Une erreur est survenue");
        err.code = data.code || "";
        err.data = data;
        throw err;
      }
      return data;
    }

    async function sha256(value){
      const bytes = new TextEncoder().encode(value);
      const digest = await crypto.subtle.digest("SHA-256",bytes);
      return [...new Uint8Array(digest)].map(byte => byte.toString(16).padStart(2,"0")).join("");
    }

    async function clientPasswordHash(email,password){
      return sha256(`${String(email).trim().toLowerCase()}|${password}|${CLIENT_HASH_SALT}`);
    }

    function toast(title,message,type="success"){
      const root = document.getElementById("toast-root");
      const id = `toast-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      root.insertAdjacentHTML("beforeend",`
        <div class="toast ${type}" id="${id}">
          ${icon(type === "error" ? "alert" : "check")}
          <div><strong>${escapeHtml(title)}</strong><span>${escapeHtml(message)}</span></div>
        </div>
      `);
      setTimeout(() => document.getElementById(id)?.remove(),4800);
    }

    function setButtonLoading(button,loading,label){
      if(!button) return;
      if(loading){
        button.dataset.original = button.innerHTML;
        button.disabled = true;
        button.innerHTML = `<span class="spinner"></span>${escapeHtml(label || "Traitement")}`;
      }else{
        button.disabled = false;
        if(button.dataset.original) button.innerHTML = button.dataset.original;
      }
    }

      return !!active && ["INPUT","TEXTAREA","SELECT"].includes(active.tagName);

        arrival:"Mohéli",
        outboundDate:"",
        outboundSlot:"",
        returnDate:"",
        returnSlot:"",

        children:0,

    async function loadBootstrap(silent=false){
      try{
        const data = await api("bootstrap",{},"GET");
        APP.config = mergeDeep(DEFAULT_CONFIG,data.config || {});
        APP.availability = data.availability || {};
        const signature = JSON.stringify({config:APP.config,availability:APP.availability});
        const changed = signature !== APP.lastBootstrapSignature;
        APP.lastBootstrapSignature = signature;
        if(!silent || changed && !isUserTyping()){
          render();
        }
      }catch(error){
        if(!silent){
          toast("Serveur indisponible",error.message,"error");
          render();
        }
      }
    }

    function renderCounter(type,label,helper,value){
      return `
        <div class="counter-card">
          <label>${escapeHtml(label)}</label>
          <small>${escapeHtml(helper)}</small>
          <div class="counter-controls">
            <button class="counter-button" aria-label="Retirer" onclick="changeCounter('${type}',-1)">−</button>
            <span class="counter-value">${Number(value)}</span>

          </div>
        </div>
      `;
    }

    function renderCalendarBlock(leg,title,offset,selectedDate,selectedSlot,minDate=""){
      const base = new Date();
      base.setDate(1);
      base.setMonth(base.getMonth() + offset);
      const next = new Date(base);
      next.setMonth(next.getMonth() + 1);

      return `
        <div class="calendar-toolbar">
          <div><strong>${escapeHtml(title)}</strong><div style="color:var(--muted-2);font-size:12px;margin-top:4px">Choisissez une date ouverte</div></div>
          <div style="display:flex;gap:8px">
            <button class="button button-secondary button-icon button-small" aria-label="Mois précédent" onclick="changeBookingMonth('${leg}',-1)">${icon("chevron-left")}</button>
            <button class="button button-secondary button-icon button-small" aria-label="Mois suivant" onclick="changeBookingMonth('${leg}',1)">${icon("chevron-right")}</button>
          </div>
        </div>
        <div class="calendar-wrap">
          ${renderMonth(base.getFullYear(),base.getMonth(),leg,selectedDate,minDate)}
          ${renderMonth(next.getFullYear(),next.getMonth(),leg,selectedDate,minDate)}
        </div>
        ${selectedDate ? renderSlots(leg,selectedDate,selectedSlot) : ""}
      `;
    }

    function renderMonth(year,month,leg,selectedDate,minDate=""){
      const monthDate = new Date(year,month,1);
      const title = new Intl.DateTimeFormat("fr-FR",{month:"long",year:"numeric"}).format(monthDate);
      const firstDay = (monthDate.getDay() + 6) % 7;
      const daysCount = new Date(year,month + 1,0).getDate();
      const today = new Date();
      today.setHours(0,0,0,0);
      let days = "";
      for(let i=0;i<firstDay;i++) days += `<span></span>`;
      for(let day=1;day<=daysCount;day++){
        const date = `${year}-${String(month + 1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
        const dateObj = new Date(`${date}T00:00:00`);
        const info = APP.availability[date];
        const open = !!info && (
          info.morning?.enabled && Number(info.morning.remaining) > 0 ||
          info.afternoon?.enabled && Number(info.afternoon.remaining) > 0
        );
        const disabledByReturn = minDate && date < minDate;
        const available = dateObj >= today && open && !disabledByReturn;
        days += `
          <button class="day ${available ? "available" : ""} ${selectedDate === date ? "selected" : ""}"
            ${available ? `onclick="selectBookingDate('${leg}','${date}')"` : "disabled"}>
            ${day}
            ${available ? `<span class="day-dots">${info.morning?.enabled ? `<i class="day-dot"></i>` : ""}${info.afternoon?.enabled ? `<i class="day-dot afternoon"></i>` : ""}</span>` : ""}
          </button>
        `;
      }
      return `
        <div class="month">
          <div class="month-title">${escapeHtml(title)}</div>
          <div class="weekdays">${["L","M","M","J","V","S","D"].map(x => `<span class="weekday">${x}</span>`).join("")}</div>
          <div class="days">${days}</div>
        </div>
      `;
    }

    function renderSlots(leg,date,selectedSlot){
      const info = APP.availability[date] || {};
      return `
        <div class="slot-grid">
          ${renderSlotButton(leg,date,"morning",info.morning,selectedSlot)}
          ${renderSlotButton(leg,date,"afternoon",info.afternoon,selectedSlot)}
        </div>
      `;
    }

    function renderSlotButton(leg,date,slot,info,selectedSlot){
      const enabled = info?.enabled && Number(info.remaining) > 0;
      return `
        <button class="slot-button ${selectedSlot === slot ? "selected" : ""}" ${enabled ? `onclick="selectBookingSlot('${leg}','${slot}')"` : "disabled"}>
          <strong>${icon("clock","icon-sm")}${slotLabel(slot)}${info?.time ? ` à ${escapeHtml(info.time)}` : ""}</strong>
          <span>${enabled ? `${info.remaining} places disponibles` : "Départ indisponible"}</span>
        </button>
      `;
    }

    function renderBookingStepTwo(){
      ensurePassengers();
      const phoneOptions = PHONE_CODES.map(([code,name]) => {
        if(code === "---") return `<option disabled>──────────</option>`;
        return `<option value="${escapeHtml(code)}" ${code === "+269" ? "selected" : ""}>${escapeHtml(code)} ${escapeHtml(name)}</option>`;
      }).join("");

      const passengers = APP.booking.passengers.map((p,index) => `
        <div class="passenger-card">
          <h3>Passager ${index + 1} — ${escapeHtml(p.type)}</h3>
          <div class="form-grid">
            <div class="field"><label>Nom</label><input class="input passenger-name" data-index="${index}" value="${escapeHtml(p.name)}" placeholder="Nom"></div>
            <div class="field"><label>Prénom</label><input class="input passenger-firstname" data-index="${index}" value="${escapeHtml(p.firstName)}" placeholder="Prénom"></div>
          </div>
        </div>
      `).join("");

      return `
        <div class="notice">${icon("user")}<div>Les coordonnées du compte sont utilisées pour le suivi. Les noms des passagers doivent correspondre aux documents présentés au départ.</div></div>
        <div class="passenger-list">${passengers}</div>
        <div class="form-grid" style="margin-top:18px">
          <div class="field"><label>Adresse e-mail</label><input class="input" value="${escapeHtml(APP.clientSession.user.email)}" disabled></div>
          <div class="field"><label>Téléphone du compte</label><input class="input" value="${escapeHtml(APP.clientSession.user.phone || "Non renseigné")}" disabled></div>
        </div>
        <div class="form-actions">
          <button class="button button-secondary" onclick="savePassengerInputs();APP.booking.step=1;render()">${icon("arrow-left","icon-sm")}Retour</button>
          <button class="button button-primary" onclick="goBookingStepThree()">Voir le récapitulatif${icon("arrow-right","icon-sm")}</button>
        </div>
      `;
    }

    function renderBookingStepThree(){
      const totals = calculateBookingTotals();
      const b = APP.booking;
      return `
        <div class="summary">
          <div class="summary-row"><span>Trajet</span><span>${escapeHtml(b.departure)} vers ${escapeHtml(b.arrival)}</span></div>
          <div class="summary-row"><span>Aller</span><span>${escapeHtml(formatDate(b.outboundDate))} — ${slotLabel(b.outboundSlot)} à ${escapeHtml(getSlotTime(b.outboundDate,b.outboundSlot))}</span></div>
          ${b.tripType === "roundTrip" ? `<div class="summary-row"><span>Retour</span><span>${escapeHtml(formatDate(b.returnDate))} — ${slotLabel(b.returnSlot)} à ${escapeHtml(getSlotTime(b.returnDate,b.returnSlot))}</span></div>` : ""}
          <div class="summary-row"><span>Adultes</span><span>${b.adults}</span></div>
          <div class="summary-row"><span>Enfants</span><span>${b.children}</span></div>
          ${feature("baggage") ? `<div class="summary-row"><span>Bagages</span><span>${b.baggage}</span></div>` : ""}
          <div class="summary-row"><span>Tarif passagers</span><span>${formatMoney(totals.base)}</span></div>
          ${feature("baggage") ? `<div class="summary-row"><span>Tarif bagages</span><span>${formatMoney(totals.baggage)}</span></div>` : ""}
          <div class="summary-row summary-total"><span>Total</span><span>${formatMoney(totals.total)}</span></div>
        </div>
        <div class="notice warning" style="margin-top:16px">${icon("alert")}<div>Une annulation au moins ${APP.config.rules.cancellationFreeHours} heures avant le départ est gratuite. Une annulation plus tardive entraîne une pénalité de ${formatMoney(APP.config.prices.lateCancellationPenalty)}.</div></div>
        <div class="form-actions">
          <button class="button button-secondary" onclick="APP.booking.step=2;render()">${icon("arrow-left","icon-sm")}Modifier</button>
          <button class="button button-primary" id="booking-submit" onclick="submitBooking()">${icon("check")}Confirmer la réservation</button>
        </div>
      `;
    }

    function renderBookingSuccess(){
      const booking = APP.booking.lastBooking;
      return `
        <div class="gate">
          <div class="gate-icon">${icon("check","icon-lg")}</div>
          <h2>Réservation enregistrée</h2>
          <p>Votre référence est ${escapeHtml(booking?.id || "")}. Retrouvez le trajet et son statut dans votre espace de gestion.</p>
          <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap">
            <button class="button button-primary" onclick="showView('manage')">${icon("ticket")}Voir ma réservation</button>
            <button class="button button-secondary" onclick="startBooking()">${icon("calendar")}Nouvelle réservation</button>
          </div>
        </div>
      `;
    }

    function setTripType(value){
      APP.booking.tripType = value;
      if(value !== "roundTrip"){
        APP.booking.returnDate = "";
        APP.booking.returnSlot = "";
      }
      render();
    }

    function setDeparture(value){
      APP.booking.departure = value;
      APP.booking.arrival = value === "Anjouan" ? "Mohéli" : "Anjouan";
      render();
    }

    function swapRoute(){
      const old = APP.booking.departure;
      APP.booking.departure = APP.booking.arrival;
      APP.booking.arrival = old;
      render();
    }

    function changeBookingMonth(leg,direction){
      if(leg === "outbound") APP.bookingMonthOffset += direction;
      else APP.returnMonthOffset += direction;
      render();
    }

    function selectBookingDate(leg,date){
      if(leg === "outbound"){
        APP.booking.outboundDate = date;
        APP.booking.outboundSlot = "";
        if(APP.booking.returnDate && APP.booking.returnDate < date){
          APP.booking.returnDate = "";
          APP.booking.returnSlot = "";
        }
      }else{
        APP.booking.returnDate = date;
        APP.booking.returnSlot = "";
      }
      render();
    }

    function selectBookingSlot(leg,slot){
      if(leg === "outbound") APP.booking.outboundSlot = slot;
      else APP.booking.returnSlot = slot;
      render();
    }

    function changeCounter(type,direction){
      const b = APP.booking;
      if(type === "adult") b.adults = Math.max(1,b.adults + direction);
      if(type === "child") b.children = Math.max(0,b.children + direction);
      if(type === "baggage"){
        const max = b.adults + b.children;
        b.baggage = Math.min(max,Math.max(0,b.baggage + direction));
      }
      render();
    }

    function getSlotTime(date,slot){
      return APP.availability[date]?.[slot]?.time || "";
    }

    function ensurePassengers(){
      const expected = [];
      for(let i=0;i<APP.booking.adults;i++) expected.push("Adulte");
      for(let i=0;i<APP.booking.children;i++) expected.push("Enfant");
      const old = APP.booking.passengers || [];
      APP.booking.passengers = expected.map((type,index) => ({
        type,
        name:old[index]?.name || "",
        firstName:old[index]?.firstName || ""
      }));
    }

    function savePassengerInputs(){
      document.querySelectorAll(".passenger-name").forEach(input => {
        const index = Number(input.dataset.index);
        if(APP.booking.passengers[index]) APP.booking.passengers[index].name = input.value.trim();
      });
      document.querySelectorAll(".passenger-firstname").forEach(input => {
        const index = Number(input.dataset.index);
        if(APP.booking.passengers[index]) APP.booking.passengers[index].firstName = input.value.trim();
      });
    }

    function goBookingStepTwo(){
      const b = APP.booking;
      if(!b.outboundDate || !b.outboundSlot){
        toast("Sélection incomplète","Choisissez la date et l’heure de l’aller","error");
        return;
      }
      if(b.tripType === "roundTrip" && (!b.returnDate || !b.returnSlot)){
        toast("Sélection incomplète","Choisissez la date et l’heure du retour","error");
        return;
      }
      ensurePassengers();
      b.step = 2;
      render();
    }

    function goBookingStepThree(){
      savePassengerInputs();
      if(APP.booking.passengers.some(p => !p.name || !p.firstName)){
        toast("Informations manquantes","Renseignez le nom et le prénom de chaque passager","error");
        return;
      }
      APP.booking.step = 3;
      render();
    }

    function calculateBookingTotals(){
      const b = APP.booking;
      const legs = b.tripType === "roundTrip" ? 2 : 1;
      const base = legs * (b.adults * Number(APP.config.prices.adult) + b.children * Number(APP.config.prices.child));
      const baggage = feature("baggage") ? legs * b.baggage * Number(APP.config.prices.baggage) : 0;
      return {base,baggage,total:base + baggage};
    }

    async function submitBooking(){
      const button = document.getElementById("booking-submit");
      setButtonLoading(button,true,"Confirmation");
      try{
        const b = APP.booking;
        const result = await api("new_booking",{
          clientToken:APP.clientSession.token,
          booking:{
            tripType:b.tripType,
            departure:b.departure,
            arrival:b.arrival,
            outboundDate:b.outboundDate,
            outboundSlot:b.outboundSlot,
            returnDate:b.returnDate,
            returnSlot:b.returnSlot,
            adults:b.adults,
            children:b.children,
            baggage:b.baggage,
            passengers:b.passengers
          }
        });
        APP.booking.lastBooking = result.booking;
        APP.booking.step = 4;
        await loadBootstrap(true);
        render();
        toast("Réservation confirmée",`Référence ${result.booking.id}`);
      }catch(error){
        toast("Réservation refusée",error.message,"error");
      }finally{
        setButtonLoading(button,false);
      }
    }

    async function loadClientBookings(silent=false){
      if(!clientLoggedIn()) return;
      try{
        const data = await api("client_bookings",{clientToken:APP.clientSession.token});
        APP.clientBookings = data.bookings || [];
        if(!silent || !isUserTyping()) render();
      }catch(error){
        if(error.code === "SESSION_INVALID") clientLogout(false);
        if(!silent) toast("Chargement impossible",error.message,"error");
      }
    }

    function renderManage(){
      const header = renderSectionHeader("Espace client","Gérer ma réservation","Consultez vos départs, vos horaires et les conditions d’annulation.");
      if(!feature("manageReservations")){
        return header + `<div class="content-card"><div class="content-card-body">${authGate("Gestion indisponible","Cette fonctionnalité est temporairement désactivée.")}</div></div>`;
      }
      if(!clientLoggedIn()){
        return header + `<div class="content-card"><div class="content-card-body">${authGate("Connexion requise","Connectez-vous avec votre adresse e-mail pour afficher vos réservations.")}</div></div>`;
      }

      const cards = APP.clientBookings.map(booking => {
        const cancel = booking.cancellation || {};
        const cancellationCopy = !cancel.allowed
          ? cancel.reason || "Annulation indisponible"
          : cancel.penalty > 0
            ? `Pénalité de ${formatMoney(cancel.penalty)}`
            : "Annulation gratuite";
        return `
          <article class="booking-card">
            <div class="booking-head">
              <div><div class="booking-ref">Référence ${escapeHtml(booking.id)}</div><h3>${escapeHtml(booking.departure)} vers ${escapeHtml(booking.arrival)}</h3></div>
              <span class="badge ${statusClass(booking.status)}">${escapeHtml(booking.status)}</span>
            </div>
            <div class="booking-meta">
              <div class="meta-box"><span>Date de départ</span><strong>${escapeHtml(formatDate(booking.outboundDate))}</strong></div>
              <div class="meta-box"><span>Heure</span><strong>${slotLabel(booking.outboundSlot)} à ${escapeHtml(booking.outboundTime)}</strong></div>
              <div class="meta-box"><span>Passagers</span><strong>${booking.adults + booking.children}</strong></div>
              <div class="meta-box"><span>Total</span><strong>${formatMoney(booking.total)}</strong></div>
            </div>
            ${Number(booking.penaltyAmount) > 0 ? `<div class="notice danger" style="margin-top:14px">${icon("alert")}<div>Pénalité due ${formatMoney(booking.penaltyAmount)}</div></div>` : ""}
            <div class="booking-actions">
              ${feature("cancellation") && cancel.allowed && !String(booking.status).toLowerCase().includes("annul") ? `<button class="button ${cancel.penalty > 0 ? "button-warning" : "button-danger"} button-small" onclick="cancelClientBooking('${escapeHtml(booking.id)}',${Number(cancel.penalty || 0)})">${icon("x","icon-sm")}${escapeHtml(cancellationCopy)}</button>` : ""}
            </div>
          </article>
        `;
      }).join("");

      return `
        <div class="section-shell">
          ${header}
          <div class="content-card">
            <div class="content-card-body">
              <div style="display:flex;justify-content:flex-end;margin-bottom:14px"><button class="button button-secondary button-small" onclick="loadClientBookings()">${icon("refresh","icon-sm")}Actualiser</button></div>
              <div class="booking-list">${cards || `<div class="empty-state">Aucune réservation enregistrée sur ce compte.</div>`}</div>
            </div>
          </div>
        </div>
      `;
    }

    async function cancelClientBooking(id,penalty){
      const copy = penalty > 0
        ? `Cette annulation entraîne une pénalité de ${formatMoney(penalty)}. Confirmer`
        : "Confirmer l’annulation gratuite";
      if(!confirm(copy)) return;
      try{
        await api("cancel_booking",{clientToken:APP.clientSession.token,bookingId:id});
        toast("Réservation annulée",penalty > 0 ? `Pénalité appliquée ${formatMoney(penalty)}` : "Aucune pénalité appliquée");
        await loadClientBookings();
        await loadBootstrap(true);
      }catch(error){
        toast("Annulation impossible",error.message,"error");
      }
    }

    async function loadClientChat(silent=false){
      if(!clientLoggedIn() || !feature("chat")) return;
      try{
        const data = await api("client_chat_get",{clientToken:APP.clientSession.token});
        APP.clientChat = {threadId:data.threadId || "",messages:data.messages || []};
        if(!silent || !isUserTyping()) render();
      }catch(error){
        if(!silent) toast("Messagerie indisponible",error.message,"error");
      }
    }

    async function sendClientChat(){
      const input = document.getElementById("client-chat-input");
      const message = input?.value.trim();
      if(!message) return;
      input.value = "";
      try{
        await api("client_chat_send",{clientToken:APP.clientSession.token,message});
        await loadClientChat();
      }catch(error){
        toast("Message non envoyé",error.message,"error");
      }
    }

    function emailField(id,label){
      return `<div class="field"><label>${label}</label><div class="input-wrap"><span class="input-leading">${icon("mail","icon-sm")}</span><input class="input" id="${id}" type="email" autocomplete="email" placeholder="${label}"></div></div>`;

    function passwordField(id,label){
      return `<div class="field"><label>${label}</label><div class="input-wrap"><span class="input-leading">${icon("lock","icon-sm")}</span><input class="input" id="${id}" type="password" autocomplete="current-password" placeholder="${label}"><button class="input-action" type="button" aria-label="Afficher le mot de passe" onclick="togglePassword('${id}',this)">${icon("eye","icon-sm")}</button></div></div>`;
    }

    function openAuth(mode="login"){
      APP.authMode = mode;
      document.getElementById("modal-root").innerHTML = `<div class="modal-backdrop" id="auth-modal" onclick="if(event.target===this)closeAuth()"></div>`;
      renderAuthModal();
    }

    function closeAuth(){
      document.getElementById("modal-root").innerHTML = "";
    }

    function setAuthMode(mode){
      if(mode === "signup" && !feature("signup")) return;
      APP.authMode = mode;
      renderAuthModal();
    }

    function togglePassword(id,button){
      const input = document.getElementById(id);
      if(!input) return;
      input.type = input.type === "password" ? "text" : "password";
      button.innerHTML = icon(input.type === "password" ? "eye" : "eye-off","icon-sm");
    }

    async function submitClientLogin(){
      const email = document.getElementById("auth-login-email")?.value.trim().toLowerCase();
      const password = document.getElementById("auth-login-password")?.value || "";
      if(!email || !password){
        toast("Champs manquants","Saisissez votre adresse e-mail et votre mot de passe","error");
        return;
      }
      const button = document.getElementById("auth-submit");
      setButtonLoading(button,true,"Connexion");
      try{
        const passHash = await clientPasswordHash(email,password);
        const data = await api("client_login",{email,passHash});
        APP.clientSession = {token:data.token,user:data.user};
        writeStorage(CLIENT_SESSION_KEY,APP.clientSession);
        closeAuth();
        toast("Connexion réussie",`Bienvenue ${data.user.name}`);
        if(APP.view === "manage") await loadClientBookings(true);
        if(APP.view === "help") await loadClientChat(true);
        render();
      }catch(error){
        toast("Connexion refusée",error.message,"error");
      }finally{
        setButtonLoading(button,false);
      }
    }

    async function submitClientSignup(){
      const name = document.getElementById("auth-signup-name")?.value.trim();
      const email = document.getElementById("auth-signup-email")?.value.trim().toLowerCase();
      const code = document.getElementById("auth-signup-code")?.value || "+269";
      const phone = document.getElementById("auth-signup-phone")?.value.trim();
      const password = document.getElementById("auth-signup-password")?.value || "";
      const confirmPassword = document.getElementById("auth-signup-confirm")?.value || "";
      if(!name || !email || !phone || !password || !confirmPassword){
        toast("Champs manquants","Complétez toutes les informations","error");
        return;
      }
      if(password.length < 8){
        toast("Mot de passe trop court","Utilisez au moins huit caractères","error");
        return;
      }
      if(password !== confirmPassword){
        toast("Confirmation incorrecte","Les mots de passe ne correspondent pas","error");
        return;
      }
      const button = document.getElementById("auth-submit");
      setButtonLoading(button,true,"Création");
      try{
        const passHash = await clientPasswordHash(email,password);
        const data = await api("signup",{name,email,phone:`${code} ${phone}`,passHash});
        APP.clientSession = {token:data.token,user:data.user};
        writeStorage(CLIENT_SESSION_KEY,APP.clientSession);
        closeAuth();
        toast("Compte créé","Votre espace client est prêt");
        render();
      }catch(error){
        toast("Inscription impossible",error.message,"error");
      }finally{
        setButtonLoading(button,false);
      }
    }

    async function submitPasswordReset(){
      const email = document.getElementById("auth-reset-email")?.value.trim().toLowerCase();
      if(!email){
        toast("Adresse manquante","Saisissez votre adresse e-mail","error");
        return;
      }
      const button = document.getElementById("auth-submit");
      setButtonLoading(button,true,"Envoi");
      try{
        const data = await api("reset_password",{email});
        toast("Demande traitée",data.message || "Consultez votre boîte e-mail");
        setAuthMode("login");
      }catch(error){
        toast("Réinitialisation refusée",error.message,"error");
      }finally{
        setButtonLoading(button,false);
      }
    }

    async function adminLogin(){
      const username = document.getElementById("admin-username")?.value.trim();
      const password = document.getElementById("admin-password")?.value || "";
      const button = document.getElementById("admin-login-button");
      if(username !== "abadmin" || !password){
        toast("Accès refusé","Identifiant administrateur invalide","error");
        return;
      }
      setButtonLoading(button,true,"Connexion");
      try{
        const passHash = await sha256(password);
        const data = await api("admin_login",{username,passHash});
        APP.adminSession = {token:data.token,username:data.username};
        writeStorage(ADMIN_SESSION_KEY,APP.adminSession,true);
        await loadAdminData(true);
        render();
      }catch(error){
        toast("Accès refusé",error.message,"error");
      }finally{
        setButtonLoading(button,false);
      }
    }

    async function adminLogout(){
      const token = APP.adminSession?.token;
      APP.adminSession = null;
      APP.adminData = null;
      writeStorage(ADMIN_SESSION_KEY,null,true);
      if(token) api("admin_logout",{adminToken:token}).catch(() => {});
      render();

    async function loadAdminData(silent=false){
      if(!adminLoggedIn()) return;
      try{
        const data = await api("admin_dashboard",{adminToken:APP.adminSession.token});
        APP.adminData = data;
        APP.config = mergeDeep(DEFAULT_CONFIG,data.config || {});
        APP.availability = data.availability || {};
        const signature = JSON.stringify(data);
        const changed = signature !== APP.lastAdminSignature;
        APP.lastAdminSignature = signature;
        if(!silent || changed && !isUserTyping()) render();
      }catch(error){
        if(error.code === "SESSION_INVALID"){
          APP.adminSession = null;
          writeStorage(ADMIN_SESSION_KEY,null,true);
          render();
        }
        if(!silent) toast("Administration indisponible",error.message,"error");
      }

    function renderAdminSchedules(){
      const base = new Date();
      base.setDate(1);
      base.setMonth(base.getMonth() + APP.adminMonthOffset);
      const next = new Date(base);
      next.setMonth(next.getMonth() + 1);
      return `
        ${renderAdminHeader("Gestion des départs","Ouvrez les créneaux et définissez l’heure exacte du matin et de l’après-midi")}
        <div class="admin-card">
          <div class="admin-card-head">
            <h2>Calendrier des disponibilités</h2>
            <div style="display:flex;gap:8px">
              <button class="button button-secondary button-small" onclick="APP.adminMonthOffset--;render()">${icon("chevron-left","icon-sm")}Précédent</button>
              <button class="button button-secondary button-small" onclick="APP.adminMonthOffset++;render()">Suivant${icon("chevron-right","icon-sm")}</button>
            </div>
          </div>
          <div class="admin-card-body">
            <div class="admin-calendar-grid">
              ${renderAdminMonth(base.getFullYear(),base.getMonth())}
              ${renderAdminMonth(next.getFullYear(),next.getMonth())}
            </div>
            <div class="admin-card" style="margin-top:16px">
              <div class="admin-card-body">
                <div class="panel-head">
                  <div><h3 style="margin:0">${APP.adminSelectedDates.size} date sélectionnée</h3><p class="panel-subtitle">Les mêmes horaires seront appliqués à toutes les dates choisies.</p></div>
                  <button class="button button-secondary button-small" onclick="APP.adminSelectedDates.clear();render()">Effacer la sélection</button>
                </div>
                <div class="form-grid">
                  <div class="field"><label>Activer le matin</label><label class="switch"><input type="checkbox" id="admin-morning-enabled" checked><span class="switch-slider"></span></label></div>
                  <div class="field"><label>Heure du matin</label><input class="input" type="time" id="admin-morning-time" value="${escapeHtml(APP.config.defaultTimes.morning)}"></div>
                  <div class="field"><label>Activer l’après-midi</label><label class="switch"><input type="checkbox" id="admin-afternoon-enabled"><span class="switch-slider"></span></label></div>
                  <div class="field"><label>Heure de l’après-midi</label><input class="input" type="time" id="admin-afternoon-time" value="${escapeHtml(APP.config.defaultTimes.afternoon)}"></div>
                </div>
                <div class="form-actions">
                  <button class="button button-danger" onclick="applyAdminAvailability(true)">${icon("trash","icon-sm")}Fermer les dates</button>
                  <button class="button button-primary" id="availability-save" onclick="applyAdminAvailability(false)">${icon("check","icon-sm")}Enregistrer les départs</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderAdminMonth(year,month){
      const date = new Date(year,month,1);
      const title = new Intl.DateTimeFormat("fr-FR",{month:"long",year:"numeric"}).format(date);
      const firstDay = (date.getDay() + 6) % 7;
      const count = new Date(year,month + 1,0).getDate();
      const today = new Date();
      today.setHours(0,0,0,0);
      let days = "";
      for(let i=0;i<firstDay;i++) days += `<span></span>`;
      for(let day=1;day<=count;day++){
        const value = `${year}-${String(month + 1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
        const past = new Date(`${value}T00:00:00`) < today;
        const info = APP.availability[value];
        const open = info?.morning?.enabled || info?.afternoon?.enabled;
        days += `
          <button class="day admin-day ${open ? "available" : ""} ${APP.adminSelectedDates.has(value) ? "selected" : ""}" ${past ? "disabled" : `onclick="toggleAdminDate('${value}')"`}>
            ${day}
            ${open ? `<span class="day-dots">${info.morning?.enabled ? `<i class="day-dot"></i>` : ""}${info.afternoon?.enabled ? `<i class="day-dot afternoon"></i>` : ""}</span>` : ""}
          </button>
        `;
      }
      return `<div class="month"><div class="month-title">${escapeHtml(title)}</div><div class="weekdays">${["L","M","M","J","V","S","D"].map(x => `<span class="weekday">${x}</span>`).join("")}</div><div class="days">${days}</div></div>`;
    }

    function toggleAdminDate(date){
      if(APP.adminSelectedDates.has(date)) APP.adminSelectedDates.delete(date);
      else APP.adminSelectedDates.add(date);
      render();
    }

    async function applyAdminAvailability(closeDates){
      if(!APP.adminSelectedDates.size){
        toast("Aucune date","Sélectionnez au moins une date","error");
        return;
      }
      const button = document.getElementById("availability-save");
      setButtonLoading(button,true,"Enregistrement");
      try{
        await api("admin_update_availability",{
          adminToken:APP.adminSession.token,
          dates:[...APP.adminSelectedDates],
          morningEnabled:closeDates ? false : document.getElementById("admin-morning-enabled").checked,
          morningTime:document.getElementById("admin-morning-time").value,
          afternoonEnabled:closeDates ? false : document.getElementById("admin-afternoon-enabled").checked,
          afternoonTime:document.getElementById("admin-afternoon-time").value
        });
        APP.adminSelectedDates.clear();
        await loadAdminData(true);
        render();
        toast("Départs enregistrés","Les disponibilités sont maintenant à jour");
      }catch(error){
        toast("Enregistrement impossible",error.message,"error");
      }finally{
        setButtonLoading(button,false);
      }
    }

    function renderAdminBookings(){
      return `
        ${renderAdminHeader("Réservations","Validation, paiement, annulation et édition des dossiers")}
        <div class="admin-card">
          <div class="admin-card-head"><h2>Liste complète</h2><input class="input" id="admin-booking-search" style="max-width:310px" placeholder="Rechercher une référence" oninput="filterAdminBookings()"></div>
          <div class="admin-card-body"><div id="admin-booking-table">${renderBookingsTable(APP.adminData.bookings || [])}</div></div>
        </div>
      `;
    }

    function renderBookingsTable(bookings){
      if(!bookings.length) return `<div class="empty-state">Aucune réservation.</div>`;
      return `
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Référence</th><th>Client</th><th>Trajet</th><th>Départ</th><th>Total</th><th>Statut</th><th>Actions</th></tr></thead>
            <tbody>
              ${bookings.map(booking => `
                <tr data-search="${escapeHtml(`${booking.id} ${booking.email} ${booking.contact}`.toLowerCase())}">
                  <td><strong>${escapeHtml(booking.id)}</strong><div style="color:var(--muted-2);margin-top:4px">${escapeHtml(booking.createdAt)}</div></td>
                  <td>${escapeHtml(booking.contact)}<div style="color:var(--muted-2);margin-top:4px">${escapeHtml(booking.email)}</div></td>
                  <td>${escapeHtml(booking.departure)} vers ${escapeHtml(booking.arrival)}<div style="color:var(--muted-2);margin-top:4px">${booking.adults} adulte — ${booking.children} enfant — ${booking.baggage} bagage</div></td>
                  <td>${escapeHtml(formatDate(booking.outboundDate))}<div style="color:var(--muted-2);margin-top:4px">${slotLabel(booking.outboundSlot)} à ${escapeHtml(booking.outboundTime)}</div></td>
                  <td>${formatMoney(booking.total)}${Number(booking.penaltyAmount) ? `<div style="color:#ff9da6;margin-top:4px">Pénalité ${formatMoney(booking.penaltyAmount)}</div>` : ""}</td>
                  <td><span class="badge ${statusClass(booking.status)}">${escapeHtml(booking.status)}</span><div style="margin-top:5px;color:var(--muted-2)">${escapeHtml(booking.paymentStatus)}</div></td>
                  <td><div class="table-actions">
                    <button class="button button-primary button-small" onclick="adminUpdateBooking('${escapeHtml(booking.id)}','Confirmée','Payé')">${icon("check","icon-sm")}Payé</button>
                    <button class="button button-warning button-small" onclick="adminUpdateBooking('${escapeHtml(booking.id)}','Confirmée','À payer')">À payer</button>
                    <button class="button button-secondary button-small" onclick="adminSendReceipt('${escapeHtml(booking.id)}')">${icon("ticket","icon-sm")}Reçu</button>
                    <button class="button button-danger button-small" onclick="adminUpdateBooking('${escapeHtml(booking.id)}','Annulée par administration','Non applicable')">${icon("ban","icon-sm")}Annuler</button>
                    <button class="button button-danger button-small" onclick="adminDeleteBooking('${escapeHtml(booking.id)}')">${icon("trash","icon-sm")}</button>
                  </div></td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function filterAdminBookings(){
      const value = document.getElementById("admin-booking-search")?.value.trim().toLowerCase() || "";
      document.querySelectorAll("#admin-booking-table tbody tr").forEach(row => {
        row.style.display = row.dataset.search.includes(value) ? "" : "none";
      });
    }

    async function adminUpdateBooking(id,status,paymentStatus){
      try{
        await api("admin_update_booking",{adminToken:APP.adminSession.token,bookingId:id,status,paymentStatus});
        await loadAdminData(true);
        render();
        toast("Réservation mise à jour",id);
      }catch(error){
        toast("Mise à jour impossible",error.message,"error");
      }
    }

    async function adminDeleteBooking(id){
      if(!confirm("Supprimer définitivement cette réservation")) return;
      try{
        await api("admin_delete_booking",{adminToken:APP.adminSession.token,bookingId:id});
        await loadAdminData(true);
        render();
        toast("Réservation supprimée",id);
      }catch(error){
        toast("Suppression impossible",error.message,"error");
      }
    }

    async function adminSendReceipt(id){
      const booking = APP.adminData.bookings.find(item => item.id === id);
      if(!booking) return;
      if(!window.jspdf){
        toast("Module PDF indisponible","Rechargez la page puis réessayez","error");
        return;
      }
      const {jsPDF} = window.jspdf;
      const doc = new jsPDF({unit:"mm",format:"a4"});
      doc.setFillColor(7,22,43);
      doc.rect(0,0,210,42,"F");
      doc.setTextColor(255,255,255);
      doc.setFont("helvetica","bold");
      doc.setFontSize(23);
      doc.text("AB MOTORS",16,19);
      doc.setFontSize(11);
      doc.setFont("helvetica","normal");
      doc.text("Reçu de réservation maritime",16,29);
      doc.setTextColor(15,30,48);
      doc.setFont("helvetica","bold");
      doc.setFontSize(15);
      doc.text(`Référence ${booking.id}`,16,57);
      doc.setFontSize(10);
      doc.setFont("helvetica","normal");
      const lines = [
        `Client : ${booking.contact}`,
        `Adresse e-mail : ${booking.email}`,
        `Téléphone : ${booking.phone}`,
        `Trajet : ${booking.departure} vers ${booking.arrival}`,
        `Départ : ${formatDate(booking.outboundDate)} — ${slotLabel(booking.outboundSlot)} à ${booking.outboundTime}`,
        booking.tripType === "roundTrip" ? `Retour : ${formatDate(booking.returnDate)} — ${slotLabel(booking.returnSlot)} à ${booking.returnTime}` : "",
        `Passagers : ${booking.adults} adulte — ${booking.children} enfant`,
        `Bagages : ${booking.baggage}`,
        `Total : ${formatMoney(booking.total)}`,
        `Statut : ${booking.status}`,
        `Paiement : ${booking.paymentStatus}`
      ].filter(Boolean);
      let y = 70;
      lines.forEach(line => {doc.text(line,16,y);y += 9});
      doc.setDrawColor(53,199,154);
      doc.line(16,y + 4,194,y + 4);
      doc.setTextColor(90,105,124);
      doc.text("Merci d’avoir choisi AB MOTORS.",16,y + 17);
      const pdfBase64 = doc.output("datauristring").split(",")[1];

      try{
        await api("admin_send_receipt",{adminToken:APP.adminSession.token,bookingId:id,pdfBase64});
        toast("Reçu envoyé",`Le document a été envoyé à ${booking.email}`);
      }catch(error){
        toast("Envoi impossible",error.message,"error");
      }
    }

    function renderAdminClients(){
      const clients = APP.adminData.clients || [];
      return `
        ${renderAdminHeader("Clients","Gestion des comptes, suspensions et réinitialisations")}
        <div class="admin-card">
          <div class="admin-card-head"><h2>Comptes clients</h2></div>
          <div class="admin-card-body">
            ${clients.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Client</th><th>Contact</th><th>Statut</th><th>Réinitialisations</th><th>Actions</th></tr></thead><tbody>
              ${clients.map(client => `<tr>
                <td><strong>${escapeHtml(client.name)}</strong><div style="color:var(--muted-2);margin-top:4px">${escapeHtml(client.createdAt)}</div></td>
                <td>${escapeHtml(client.email)}<div style="color:var(--muted-2);margin-top:4px">${escapeHtml(client.phone)}</div></td>
                <td><span class="badge ${statusClass(client.status)}">${escapeHtml(client.status)}</span></td>
                <td>${client.resetCount} sur 2</td>
                <td><div class="table-actions">
                  <button class="button button-secondary button-small" onclick="adminClientAction('${escapeHtml(client.email)}','RESET_COUNT')">${icon("refresh","icon-sm")}Remettre le compteur à zéro</button>
                  ${client.status === "BANNED"
                    ? `<button class="button button-primary button-small" onclick="adminClientAction('${escapeHtml(client.email)}','UNBAN')">${icon("check","icon-sm")}Réactiver</button>`
                    : `<button class="button button-danger button-small" onclick="adminClientAction('${escapeHtml(client.email)}','BAN')">${icon("ban","icon-sm")}Suspendre</button>`}
                </div></td>
              </tr>`).join("")}
            </tbody></table></div>` : `<div class="empty-state">Aucun compte client.</div>`}
          </div>
        </div>
      `;
    }

    async function adminClientAction(email,clientAction){
      try{
        await api("admin_client_update",{adminToken:APP.adminSession.token,email,clientAction});
        await loadAdminData(true);
        render();
        toast("Compte mis à jour",email);
      }catch(error){
        toast("Action impossible",error.message,"error");
      }
    }

    function renderAdminMessages(){
      const threads = APP.adminData.threads || [];
      return `
        ${renderAdminHeader("Messages","Conversations ouvertes entre les clients et l’administration")}
        <div class="thread-list">
          ${threads.length ? threads.map(thread => `
            <div class="thread-card">
              <div class="thread-head"><div><strong>${escapeHtml(thread.clientName || thread.clientEmail)}</strong><div style="color:var(--muted-2);font-size:12px;margin-top:4px">${escapeHtml(thread.clientEmail)}</div></div><span class="badge good">Ouverte</span></div>
              <div class="thread-body">${thread.messages.map(message => `<div class="message ${message.senderRole === "ADMIN" ? "client" : "admin"}">${escapeHtml(message.message)}<small>${escapeHtml(message.createdAt)} — ${message.senderRole === "ADMIN" ? "Administration" : "Client"}</small></div>`).join("")}</div>
              <div class="thread-compose">
                <input class="input" id="thread-input-${escapeHtml(thread.threadId)}" maxlength="1000" placeholder="Répondre au client">
                <button class="button button-primary button-icon" onclick="adminSendChat('${escapeHtml(thread.threadId)}')">${icon("send")}</button>
                <button class="button button-danger button-small" onclick="adminCloseChat('${escapeHtml(thread.threadId)}')">${icon("x","icon-sm")}Clôturer</button>
              </div>
            </div>
          `).join("") : `<div class="admin-card"><div class="empty-state">Aucune conversation ouverte.</div></div>`}
        </div>
      `;
    }

    async function adminSendChat(threadId){
      const input = document.getElementById(`thread-input-${threadId}`);
      const message = input?.value.trim();
      if(!message) return;
      input.value = "";
      try{
        await api("admin_chat_send",{adminToken:APP.adminSession.token,threadId,message});
        await loadAdminData(true);
        render();
      }catch(error){
        toast("Message non envoyé",error.message,"error");
      }
    }

    async function adminCloseChat(threadId){
      if(!confirm("Clôturer cette conversation")) return;
      try{
        await api("admin_chat_close",{adminToken:APP.adminSession.token,threadId});
        await loadAdminData(true);
        render();
        toast("Conversation clôturée","Elle ne sera plus affichée au client");
      }catch(error){
        toast("Clôture impossible",error.message,"error");
      }
    }

    function renderAdminConfig(){
      const c = APP.config;
      const featureRows = [
        ["booking","Réservation","Afficher et autoriser la création de réservations"],
        ["manageReservations","Gestion des réservations","Afficher l’espace de gestion client"],
        ["help","Aide","Afficher la section d’assistance"],
        ["signup","Inscription","Autoriser la création de nouveaux comptes"],
        ["baggage","Bagages","Autoriser l’ajout de bagages"],
        ["roundTrip","Aller retour","Autoriser les voyages aller retour"],
        ["cancellation","Annulation","Autoriser les annulations côté client"],
        ["chat","Messagerie","Autoriser les conversations client administrateur"],
        ["autoRefresh","Actualisation automatique","Synchroniser le site silencieusement"]
      ].map(([key,title,text]) => `
        <div class="switch-row">
          <div class="switch-copy"><strong>${title}</strong><span>${text}</span></div>
          <label class="switch"><input type="checkbox" id="feature-${key}" ${c.features[key] ? "checked" : ""}><span class="switch-slider"></span></label>
        </div>
      `).join("");

      return `
        ${renderAdminHeader("Configuration","Activation des modules, tarifs et règles du service")}
        <div class="admin-card">
          <div class="admin-card-head"><h2>Fonctionnalités du site</h2></div>
          <div class="admin-card-body">${featureRows}</div>
        </div>
        <div class="admin-card">
          <div class="admin-card-head"><h2>Tarifs modifiables</h2></div>
          <div class="admin-card-body">
            <div class="form-grid">
              <div class="field"><label>Tarif adulte par trajet</label><input class="input" type="number" min="0" step=".01" id="price-adult" value="${Number(c.prices.adult)}"></div>
              <div class="field"><label>Tarif enfant par trajet</label><input class="input" type="number" min="0" step=".01" id="price-child" value="${Number(c.prices.child)}"></div>
              <div class="field"><label>Tarif bagage par trajet</label><input class="input" type="number" min="0" step=".01" id="price-baggage" value="${Number(c.prices.baggage)}"></div>
              <div class="field"><label>Pénalité annulation tardive</label><input class="input" type="number" min="0" step=".01" id="price-penalty" value="${Number(c.prices.lateCancellationPenalty)}"></div>
              <div class="field"><label>Délai gratuit en heures</label><input class="input" type="number" min="0" step=".5" id="rule-cancel-hours" value="${Number(c.rules.cancellationFreeHours)}"></div>
              <div class="field"><label>Capacité par départ</label><input class="input" type="number" min="1" step="1" id="rule-capacity" value="${Number(c.rules.capacityPerDeparture)}"></div>
              <div class="field"><label>Heure matinale par défaut</label><input class="input" type="time" id="time-morning" value="${escapeHtml(c.defaultTimes.morning)}"></div>
              <div class="field"><label>Heure de l’après-midi par défaut</label><input class="input" type="time" id="time-afternoon" value="${escapeHtml(c.defaultTimes.afternoon)}"></div>
            </div>
            <div class="form-actions"><button class="button button-primary" id="config-save" onclick="saveAdminConfig()">${icon("check")}Enregistrer la configuration</button></div>
          </div>
        </div>
      `;
    }

    async function saveAdminConfig(){
      const button = document.getElementById("config-save");
      setButtonLoading(button,true,"Enregistrement");
      const config = structuredCloneSafe(APP.config);
      Object.keys(config.features).forEach(key => {
        const input = document.getElementById(`feature-${key}`);
        if(input) config.features[key] = input.checked;
      });
      config.prices.adult = Number(document.getElementById("price-adult").value);
      config.prices.child = Number(document.getElementById("price-child").value);
      config.prices.baggage = Number(document.getElementById("price-baggage").value);
      config.prices.lateCancellationPenalty = Number(document.getElementById("price-penalty").value);
      config.rules.cancellationFreeHours = Number(document.getElementById("rule-cancel-hours").value);
      config.rules.capacityPerDeparture = Number(document.getElementById("rule-capacity").value);
      config.defaultTimes.morning = document.getElementById("time-morning").value;
      config.defaultTimes.afternoon = document.getElementById("time-afternoon").value;
      try{
        await api("admin_save_config",{adminToken:APP.adminSession.token,config});
        await loadAdminData(true);
        render();
        toast("Configuration enregistrée","Les changements sont appliqués au site client");
      }catch(error){
        toast("Enregistrement impossible",error.message,"error");
      }finally{
        setButtonLoading(button,false);
      }
    }

    function render(){
      const adminRoute = location.hash.toLowerCase() === "#admin";
      const root = document.getElementById("app-root");
      if(adminRoute){
        root.innerHTML = adminLoggedIn() ? renderAdminShell() : renderAdminLogin();
        return;
      }

      let content = renderHome();
      if(APP.view === "reserve") content = renderReserve();
      if(APP.view === "manage") content = renderManage();
      if(APP.view === "help") content = renderHelp();
      root.innerHTML = renderClientShell(content);

      if(APP.view === "help"){
        const box = document.getElementById("client-chat-messages");
        if(box) box.scrollTop = box.scrollHeight;
      }
    }

    async function silentSync(){
      if(document.hidden) return;
      const adminRoute = location.hash.toLowerCase() === "#admin";
      if(adminRoute && adminLoggedIn()){
        await loadAdminData(true);
        return;
      }
      if(!feature("autoRefresh")) return;
      await loadBootstrap(true);
      if(APP.view === "manage" && clientLoggedIn()) await loadClientBookings(true);
      if(APP.view === "help" && clientLoggedIn() && feature("chat")) await loadClientChat(true);
    }

    window.addEventListener("hashchange",async () => {
      if(location.hash.toLowerCase() === "#admin" && adminLoggedIn()) await loadAdminData(true);
      render();
    });

    document.addEventListener("keydown",event => {
      if(event.key === "Escape") closeAuth();
      if(event.key === "Enter" && location.hash.toLowerCase() === "#admin" && !adminLoggedIn()){
        adminLogin();
      }
    });

    window.addEventListener("load",async () => {
      render();
      await loadBootstrap(true);
      if(location.hash.toLowerCase() === "#admin" && adminLoggedIn()) await loadAdminData(true);
      if(APP.view === "manage" && clientLoggedIn()) await loadClientBookings(true);
      setInterval(silentSync,AUTO_SYNC_MS);
      render();
    });
  </script>
</body>
</html>
