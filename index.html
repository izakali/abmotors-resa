<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1728">
  <title>AB MOTORS | Réservation maritime</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <style>
    :root {
      --bg: #081321;
      --bg-soft: #0c1a2d;
      --surface: #12243d;
      --surface-2: #162c49;
      --surface-3: #1a3455;
      --line: #2a4362;
      --text: #f4f7fb;
      --muted: #a9b7ca;
      --muted-2: #7f91aa;
      --primary: #32c493;
      --primary-2: #25aa80;
      --info: #67b6e8;
      --warning: #f2b84b;
      --danger: #ef5f6c;
      --success: #32c493;
      --shadow: 0 24px 70px rgba(0, 0, 0, .32);
      --radius: 20px;
      --radius-sm: 12px;
      --max: 1240px;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      background-image: url("bateau.PNG");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(circle at 12% 14%, rgba(71, 160, 193, .22), transparent 34%),
        radial-gradient(circle at 90% 54%, rgba(50, 196, 147, .15), transparent 36%),
        linear-gradient(90deg, rgba(8, 19, 33, .98) 0%, rgba(8, 19, 33, .93) 48%, rgba(8, 19, 33, .82) 100%);
    }

    button, input, select, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }
    svg { display: block; }
    .hidden { display: none !important; }

    .top-stripe {
      height: 3px;
      background: linear-gradient(90deg, #31a24c 0 22%, #f4c53d 22% 44%, #f3f5f7 44% 58%, #e8424d 58% 80%, #4a91e2 80% 100%);
    }

    .client-header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(18px);
      background: rgba(12, 26, 45, .88);
      border-bottom: 1px solid rgba(102, 137, 177, .22);
    }

    .nav-wrap {
      max-width: var(--max);
      margin: 0 auto;
      min-height: 76px;
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 0 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-width: 205px;
      cursor: pointer;
      user-select: none;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #b78a20, #f3cf69);
      color: #10213b;
      font-weight: 900;
      letter-spacing: -.04em;
      border: 1px solid rgba(255, 255, 255, .32);
      box-shadow: 0 10px 28px rgba(0, 0, 0, .24);
    }

    .brand-copy strong { display: block; font-size: 1.02rem; letter-spacing: -.02em; }
    .brand-copy span { display: block; margin-top: 2px; font-size: .74rem; color: var(--muted); }

    .client-nav {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .nav-link, .icon-button, .button, .sidebar-link, .tab-button {
      border: 0;
      cursor: pointer;
      transition: .2s ease;
    }

    .nav-link {
      color: var(--muted);
      background: transparent;
      padding: 12px 14px;
      border-radius: 10px;
      font-weight: 750;
      font-size: .92rem;
    }

    .nav-link:hover, .nav-link.active { color: var(--primary); background: rgba(50, 196, 147, .08); }

    .nav-actions { display: flex; align-items: center; gap: 10px; min-width: 205px; justify-content: flex-end; }

    .button {
      min-height: 46px;
      border-radius: 12px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    .button:disabled { opacity: .55; cursor: not-allowed; }
    .button-primary { color: #06130f; background: var(--primary); box-shadow: 0 12px 30px rgba(50, 196, 147, .22); }
    .button-primary:hover { background: #3bd3a0; transform: translateY(-1px); }
    .button-secondary { color: var(--text); background: var(--surface-2); border: 1px solid var(--line); }
    .button-secondary:hover { border-color: #466588; background: var(--surface-3); }
    .button-danger { color: #fff; background: rgba(239, 95, 108, .14); border: 1px solid rgba(239, 95, 108, .45); }
    .button-warning { color: #1a1304; background: var(--warning); }
    .button-small { min-height: 38px; padding: 0 13px; font-size: .82rem; border-radius: 10px; }
    .button-block { width: 100%; }

    .icon-button {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: var(--surface-2);
      border: 1px solid var(--line);
    }
    .icon-button:hover { color: var(--text); border-color: #47688e; }

    .mobile-menu-button { display: none; }

    .client-main {
      max-width: var(--max);
      margin: 0 auto;
      padding: 54px 24px 80px;
      min-height: calc(100vh - 79px);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(420px, .95fr);
      gap: 34px;
      align-items: start;
    }

    .hero-copy { padding: 34px 0 14px; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--primary);
      font-size: .77rem;
      font-weight: 900;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .eyebrow-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 5px rgba(50, 196, 147, .1); }

    h1, h2, h3, h4, p { margin-top: 0; }
    .hero-title {
      margin: 20px 0 20px;
      max-width: 760px;
      font-size: clamp(2.6rem, 5.8vw, 5.5rem);
      line-height: .96;
      letter-spacing: -.065em;
    }
    .hero-title span { color: #a9d7f4; }
    .hero-text { color: var(--muted); font-size: 1.08rem; line-height: 1.75; max-width: 690px; }

    .hero-points { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 30px; }
    .mini-stat { padding: 16px; border-radius: 14px; background: rgba(18, 36, 61, .84); border: 1px solid var(--line); }
    .mini-stat strong { display: block; font-size: 1rem; }
    .mini-stat span { color: var(--muted-2); font-size: .78rem; margin-top: 5px; display: block; }

    .panel {
      background: linear-gradient(165deg, rgba(21, 43, 71, .97), rgba(14, 31, 53, .98));
      border: 1px solid rgba(79, 113, 151, .38);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .booking-panel { padding: 25px; }
    .panel-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
    .panel-header h2 { margin-bottom: 7px; font-size: 1.55rem; letter-spacing: -.035em; }
    .panel-header p { color: var(--muted); margin-bottom: 0; font-size: .91rem; line-height: 1.5; }
    .step-pill { color: var(--primary); background: rgba(50, 196, 147, .1); border: 1px solid rgba(50, 196, 147, .28); padding: 8px 11px; border-radius: 999px; font-size: .76rem; font-weight: 900; white-space: nowrap; }

    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .form-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .field { min-width: 0; }
    .field-full { grid-column: 1 / -1; }
    .field label { display: block; margin-bottom: 8px; color: #d9e4f1; font-size: .79rem; font-weight: 800; }
    .field small { color: var(--muted-2); display: block; margin-top: 7px; line-height: 1.45; }

    .control {
      width: 100%;
      height: 50px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0f2037;
      color: var(--text);
      padding: 0 14px;
      outline: 0;
      transition: .2s;
    }
    textarea.control { height: auto; min-height: 110px; padding-top: 13px; resize: vertical; }
    .control::placeholder { color: #71849f; }
    .control:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(50, 196, 147, .09); }
    select.control { appearance: none; background-image: linear-gradient(45deg, transparent 50%, #91a6c0 50%), linear-gradient(135deg, #91a6c0 50%, transparent 50%); background-position: calc(100% - 19px) 22px, calc(100% - 14px) 22px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 35px; }

    .segmented { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 5px; background: #0d1d32; border: 1px solid var(--line); border-radius: 13px; }
    .segment { min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 800; cursor: pointer; }
    .segment.active { color: #07140f; background: var(--primary); }

    .slot-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .slot-card {
      min-height: 88px;
      padding: 13px;
      text-align: left;
      color: var(--text);
      background: #10223b;
      border: 1px solid var(--line);
      border-radius: 13px;
      cursor: pointer;
      transition: .2s;
    }
    .slot-card:hover:not(:disabled) { border-color: var(--primary); transform: translateY(-1px); }
    .slot-card.active { border-color: var(--primary); background: rgba(50, 196, 147, .1); box-shadow: inset 0 0 0 1px rgba(50, 196, 147, .24); }
    .slot-card:disabled { opacity: .42; cursor: not-allowed; }
    .slot-card strong { display: block; font-size: .9rem; }
    .slot-time { color: var(--primary); font-size: 1.12rem; font-weight: 900; margin-top: 5px; }
    .slot-remaining { color: var(--muted-2); font-size: .72rem; margin-top: 3px; }

    .counter-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 13px 0; border-bottom: 1px solid rgba(75, 104, 138, .28); }
    .counter-row:last-child { border-bottom: 0; }
    .counter-copy strong { display: block; font-size: .9rem; }
    .counter-copy span { color: var(--muted-2); font-size: .75rem; display: block; margin-top: 3px; }
    .counter { display: inline-flex; align-items: center; gap: 13px; }
    .counter button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); cursor: pointer; font-size: 1.1rem; }
    .counter strong { min-width: 22px; text-align: center; }

    .passenger-card, .summary-box, .notice, .reservation-card, .faq-item {
      border-radius: 14px;
      background: rgba(12, 29, 50, .72);
      border: 1px solid rgba(74, 105, 141, .35);
    }
    .passenger-card { padding: 16px; margin-bottom: 12px; }
    .passenger-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; }
    .passenger-title strong { font-size: .9rem; }
    .passenger-title span { color: var(--primary); font-size: .72rem; font-weight: 850; text-transform: uppercase; letter-spacing: .08em; }

    .summary-box { padding: 17px; }
    .summary-line { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid rgba(76, 106, 141, .28); color: var(--muted); }
    .summary-line:last-child { border-bottom: 0; }
    .summary-line strong { color: var(--text); text-align: right; }
    .summary-total { font-size: 1.35rem; color: var(--primary) !important; }

    .form-actions { display: flex; gap: 10px; margin-top: 20px; }
    .form-actions .button { flex: 1; }

    .availability-list { display: grid; gap: 10px; margin-top: 28px; }
    .availability-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; align-items: center; padding: 12px 14px; border-radius: 13px; background: rgba(18, 36, 61, .8); border: 1px solid rgba(75, 104, 138, .32); }
    .availability-row strong { font-size: .84rem; }
    .availability-slot { color: var(--muted); font-size: .76rem; display: flex; align-items: center; gap: 7px; }
    .availability-slot i { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); }

    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .page-head h1 { margin-bottom: 8px; font-size: clamp(2rem, 4vw, 3.5rem); letter-spacing: -.055em; }
    .page-head p { color: var(--muted); margin-bottom: 0; }

    .content-panel { padding: 24px; }
    .empty-state { padding: 48px 20px; text-align: center; color: var(--muted); }
    .empty-icon { width: 62px; height: 62px; margin: 0 auto 16px; display: grid; place-items: center; border-radius: 18px; background: rgba(50, 196, 147, .1); color: var(--primary); }

    .reservation-list { display: grid; gap: 14px; }
    .reservation-card { padding: 18px; }
    .reservation-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; }
    .reservation-id { font-size: .77rem; color: var(--muted-2); font-weight: 800; }
    .reservation-card h3 { margin: 5px 0 7px; font-size: 1rem; }
    .reservation-card p { color: var(--muted); line-height: 1.55; margin-bottom: 0; font-size: .87rem; }
    .reservation-meta { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; margin-top: 15px; }
    .reservation-meta div { padding: 10px; border-radius: 10px; background: #0e1f35; border: 1px solid rgba(70, 101, 139, .28); }
    .reservation-meta span { display: block; color: var(--muted-2); font-size: .68rem; text-transform: uppercase; letter-spacing: .07em; font-weight: 850; }
    .reservation-meta strong { display: block; margin-top: 4px; font-size: .82rem; }
    .reservation-actions { display: flex; justify-content: flex-end; margin-top: 14px; }

    .badge { display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; border-radius: 999px; font-size: .7rem; font-weight: 900; white-space: nowrap; }
    .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .badge-pending { color: var(--warning); background: rgba(242, 184, 75, .11); border: 1px solid rgba(242, 184, 75, .25); }
    .badge-success { color: var(--success); background: rgba(50, 196, 147, .11); border: 1px solid rgba(50, 196, 147, .25); }
    .badge-danger { color: var(--danger); background: rgba(239, 95, 108, .11); border: 1px solid rgba(239, 95, 108, .25); }
    .badge-info { color: var(--info); background: rgba(103, 182, 232, .11); border: 1px solid rgba(103, 182, 232, .25); }

    .help-grid { display: grid; grid-template-columns: 1fr .68fr; gap: 22px; }
    .faq-list { display: grid; gap: 10px; }
    .faq-item { padding: 17px; }
    .faq-item h3 { font-size: .95rem; margin-bottom: 8px; }
    .faq-item p { color: var(--muted); font-size: .87rem; line-height: 1.55; margin-bottom: 0; }
    .support-card { padding: 22px; position: sticky; top: 105px; }
    .support-card h2 { font-size: 1.25rem; }
    .support-card p { color: var(--muted); line-height: 1.6; }
    .support-line { display: flex; align-items: center; gap: 11px; padding: 12px 0; border-top: 1px solid rgba(75, 104, 138, .3); color: #dce7f4; }

    .notice { padding: 13px 15px; color: var(--muted); font-size: .82rem; line-height: 1.5; }
    .notice-info { border-color: rgba(103, 182, 232, .35); background: rgba(103, 182, 232, .07); }
    .notice-danger { border-color: rgba(239, 95, 108, .4); background: rgba(239, 95, 108, .08); color: #f5bcc2; }
    .notice-success { border-color: rgba(50, 196, 147, .38); background: rgba(50, 196, 147, .08); color: #a9ebd5; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(2, 8, 15, .78);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(680px, 100%);
      max-height: calc(100vh - 40px);
      overflow: auto;
      border-radius: 22px;
      background: linear-gradient(165deg, #152943, #0d1c31);
      border: 1px solid #314a68;
      box-shadow: 0 34px 100px rgba(0, 0, 0, .55);
    }
    .modal-header { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 22px 24px 0; }
    .modal-header h2 { margin-bottom: 0; font-size: 1.55rem; }
    .modal-body { padding: 20px 24px 25px; }
    .auth-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 5px; border: 1px solid var(--line); background: #0d1d32; border-radius: 13px; margin-bottom: 20px; }
    .tab-button { min-height: 42px; border-radius: 9px; color: var(--muted); background: transparent; font-weight: 850; }
    .tab-button.active { color: #06130f; background: var(--primary); }
    .password-wrap { position: relative; }
    .password-wrap .control { padding-right: 52px; }
    .password-toggle { position: absolute; right: 7px; top: 7px; width: 36px; height: 36px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }

    .chat-launcher {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 60;
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: #06130f;
      background: var(--primary);
      border: 0;
      box-shadow: 0 18px 40px rgba(50, 196, 147, .28);
      cursor: pointer;
    }

    .chat-panel {
      position: fixed;
      right: 24px;
      bottom: 94px;
      z-index: 70;
      width: min(410px, calc(100vw - 32px));
      height: min(610px, calc(100vh - 130px));
      display: none;
      flex-direction: column;
      border-radius: 20px;
      overflow: hidden;
      background: #10223b;
      border: 1px solid #35506f;
      box-shadow: 0 30px 90px rgba(0, 0, 0, .52);
    }
    .chat-panel.open { display: flex; }
    .chat-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 18px; border-bottom: 1px solid var(--line); background: #162b48; }
    .chat-head h3 { margin-bottom: 3px; font-size: 1rem; }
    .chat-head span { color: var(--muted); font-size: .74rem; }
    .chat-messages { flex: 1; overflow: auto; padding: 17px; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 83%; padding: 11px 13px; border-radius: 14px; line-height: 1.45; font-size: .84rem; }
    .message-client { align-self: flex-end; background: var(--primary); color: #06130f; border-bottom-right-radius: 5px; }
    .message-admin { align-self: flex-start; background: #1b3658; color: var(--text); border: 1px solid #355273; border-bottom-left-radius: 5px; }
    .message time { display: block; margin-top: 5px; font-size: .64rem; opacity: .65; }
    .chat-compose { display: grid; grid-template-columns: 1fr auto; gap: 9px; padding: 14px; border-top: 1px solid var(--line); background: #0d1d32; }

    .toast-container { position: fixed; top: 92px; right: 22px; z-index: 140; display: grid; gap: 10px; width: min(390px, calc(100vw - 44px)); }
    .toast { display: flex; align-items: flex-start; gap: 11px; padding: 14px; border-radius: 13px; background: #172c49; border: 1px solid #395675; box-shadow: 0 20px 50px rgba(0, 0, 0, .35); animation: toastIn .25s ease; }
    .toast.success { border-color: rgba(50, 196, 147, .5); }
    .toast.error { border-color: rgba(239, 95, 108, .5); }
    .toast p { margin-bottom: 0; color: #dbe6f3; font-size: .84rem; line-height: 1.45; }
    @keyframes toastIn { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }

    .loading-screen { min-height: 100vh; display: grid; place-items: center; background: #081321; }
    .loading-card { text-align: center; color: var(--muted); }
    .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(50, 196, 147, .15); border-top-color: var(--primary); animation: spin .8s linear infinite; margin: 0 auto 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .admin-shell { min-height: 100vh; background: rgba(7, 17, 30, .96); }
    .admin-topbar { position: sticky; top: 0; z-index: 80; background: rgba(18, 36, 61, .96); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
    .admin-topbar-inner { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 24px; }
    .admin-status { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .81rem; }
    .admin-status i { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
    .admin-layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - 75px); }
    .admin-sidebar { border-right: 1px solid var(--line); background: #0d1d32; padding: 22px 16px; position: sticky; top: 75px; height: calc(100vh - 75px); }
    .sidebar-nav { display: grid; gap: 7px; }
    .sidebar-link { width: 100%; min-height: 46px; display: flex; align-items: center; gap: 11px; padding: 0 13px; border-radius: 11px; color: var(--muted); background: transparent; text-align: left; font-weight: 800; }
    .sidebar-link:hover, .sidebar-link.active { color: var(--primary); background: rgba(50, 196, 147, .09); }
    .admin-content { padding: 28px; min-width: 0; }
    .admin-content-inner { max-width: 1500px; margin: 0 auto; }

    const ICONS = {

      controls: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 17h16M4 12h16"/><circle cx="8" cy="7" r="2" fill="#0d1d32"/><circle cx="16" cy="12" r="2" fill="#0d1d32"/><circle cx="10" cy="17" r="2" fill="#0d1d32"/></svg>',
